<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSH · CLI 配置管理 · 设计稿</title>
  <!--
    假设 / 判断（看完先对方向，再谈落地）
    ------------------------------------------------
    1. 这不是新页面，是现有「设置 → CLI配置管理 → DeepSeek Harness」的优化稿。
    2. DSH 和 Claude/Codex 不是同类：后者在 mossx 里管供应商/Key；
       DSH 的模型与 API Key 永远在 DSH Web UI，mossx 只负责「装 CLI + 连 host」。
    3. 现在不好用的根因不是缺字段，是信息架构错了：
       - Host / Port / 自动启动被当成主界面，和「去 DSH 配模型」平级
       - i18n 里已有「主机未运行 / 未安装」文案，界面却没接状态
       - host.describe 能给出 provider / model / 会话数，面板完全没用
       - 用户从 Claude 页过来，会下意识找「添加供应商」
    4. 视觉必须长在现有 vendor-settings 上，不另起一套科技风。
    5. 三个方案都保留现有能力：安装/更新、自定义路径、host/port、自动启动、打开 DSH。
       变的是主次、状态、以及「所有权」说明。

    未解（先按推荐稿画，你点头再细化）：
    - 要不要在面板里只读展示 DSH 当前 provider/model？（我倾向要，只读）
    - 「立即启动 host」要不要做成显式按钮？（现在只有自动启动开关）
    - Host/Port 要不要合成一行地址？（我倾向要）
  -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root {
      --text-primary: #18181b;
      --text-strong: #09090b;
      --text-secondary: rgba(24, 24, 27, 0.7);
      --text-muted: rgba(24, 24, 27, 0.55);
      --text-faint: rgba(24, 24, 27, 0.42);
      --surface-page: #ededf0;
      --surface-main: #ffffff;
      --surface-sidebar: #f4f4f5;
      --surface-hover: rgba(24, 24, 27, 0.055);
      --surface-card: rgba(255, 255, 255, 0.92);
      --surface-control: rgba(24, 24, 27, 0.06);
      --border: rgba(24, 24, 27, 0.12);
      --divider: rgba(24, 24, 27, 0.07);
      --accent: #4d99ff;
      --success: #1e9b6e;
      --warning: #d77814;
      --error: #c82d2d;
      --primary: #18181b;
      --primary-fg: #fff;
      --font: "SF Pro Text", "PingFang SC", "Noto Sans SC", -apple-system, sans-serif;
      --mono: "SF Mono", "Menlo", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #d8d8dc;
      color: var(--text-primary);
      font-family: var(--font);
    }
    button, input { font-family: inherit; }
    button { cursor: pointer; }
    img { display: block; }

    .stage {
      min-height: 100vh;
      padding: 28px 28px 48px;
    }

    .brief {
      max-width: 1180px;
      margin: 0 auto 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px 24px;
      align-items: end;
    }
    .brief h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .brief p {
      margin: 0;
      max-width: 720px;
      color: var(--text-secondary);
      font-size: 13.5px;
      line-height: 1.55;
      text-wrap: pretty;
    }
    .tweak-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .tweak-group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid rgba(24,24,27,0.12);
      border-radius: 9px;
      background: rgba(255,255,255,0.7);
    }
    .tweak-group span {
      padding: 0 8px;
      color: var(--text-faint);
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .tweak-group button {
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 6px;
    }
    .tweak-group button.on {
      background: #18181b;
      color: #fff;
    }

    .app-shell {
      max-width: 1180px;
      margin: 0 auto;
      height: 760px;
      display: grid;
      grid-template-columns: 196px 1fr;
      background: var(--surface-page);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(24,24,27,0.14), 0 0 0 1px rgba(24,24,27,0.06);
    }

    .settings-rail {
      padding: 16px 10px;
      background: var(--surface-sidebar);
      border-right: 1px solid var(--divider);
    }
    .rail-back {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 6px 14px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .rail-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      text-align: left;
    }
    .rail-item.active {
      background: rgba(24,24,27,0.07);
      color: var(--text-primary);
      font-weight: 500;
    }

    .settings-main {
      display: grid;
      grid-template-rows: 52px 1fr;
      background: var(--surface-main);
      min-width: 0;
    }
    .page-head {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 16px 24px 0;
    }
    .page-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .page-head span {
      color: var(--text-faint);
      font-size: 12.5px;
    }

    .vendor-body {
      display: grid;
      grid-template-columns: 188px 1fr;
      min-height: 0;
    }
    .engine-nav {
      padding: 14px 10px 20px 20px;
      overflow: hidden;
    }
    .search {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      margin-bottom: 10px;
      padding: 0 10px;
      border: 1px solid var(--divider);
      border-radius: 8px;
      color: var(--text-faint);
      font-size: 12.5px;
    }
    .group-label {
      margin: 8px 4px 4px;
      color: var(--text-faint);
      font-size: 11px;
      font-weight: 500;
    }
    .engine-row {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      min-height: 40px;
      padding: 6px 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      text-align: left;
    }
    .engine-row.active {
      background: #f4f4f5;
      color: var(--text-primary);
    }
    .engine-ico {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--divider);
      border-radius: 5px;
      background: #fff;
      flex-shrink: 0;
    }
    .engine-ico img { width: 15px; height: 15px; }
    .engine-ico.letter {
      font-size: 9px;
      font-weight: 700;
    }

    .detail {
      min-width: 0;
      overflow: auto;
      padding: 10px 28px 36px 24px;
      border-left: 1px solid var(--border);
    }
    .detail-inner {
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 2px 2px 10px;
      border-bottom: 1px solid var(--divider);
    }
    .brand-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-logo {
      width: 30px; height: 30px;
      display: grid; place-items: center;
      border: 1px solid var(--divider);
      border-radius: 8px;
      background: #fff;
    }
    .brand-logo img { width: 18px; height: 18px; }
    .brand-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .brand-docs {
      margin-left: 6px;
      color: var(--text-muted);
      font-size: 12px;
      text-decoration: none;
      opacity: 0.75;
    }
    .brand-actions { display: flex; align-items: center; gap: 8px; }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11px;
      background: var(--surface-control);
      color: var(--text-secondary);
    }
    .badge.ok { background: rgba(30,155,110,0.12); color: #157a57; }
    .badge.warn { background: rgba(215,120,20,0.12); color: #a85c0d; }
    .badge.err { background: rgba(200,45,45,0.1); color: #b42323; }
    .badge.outline { background: transparent; border: 1px solid var(--border); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 500;
      background: var(--primary);
      color: var(--primary-fg);
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.ghost {
      background: transparent;
      color: var(--text-secondary);
    }
    .btn.outline {
      background: #fff;
      border-color: var(--border);
      color: var(--text-primary);
    }
    .btn.sm { height: 26px; font-size: 12px; }
    .icon-btn {
      width: 26px; height: 26px; padding: 0;
      border: 0; border-radius: 6px;
      background: transparent; color: var(--text-muted);
    }

    .section-label {
      margin: 10px 0 0;
      padding: 0 2px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-card);
      overflow: hidden;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      padding: 10px 14px;
    }
    .row + .row { border-top: 1px solid var(--divider); }
    .row-copy { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .row-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
    }
    .row-help {
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.35;
    }
    .input {
      width: 148px;
      padding: 5px 8px;
      border: 1px solid var(--divider);
      border-radius: 6px;
      background: #fff;
      color: var(--text-primary);
      font-size: 12px;
    }
    .input.wide { width: 220px; }
    .switch {
      width: 32px; height: 18px;
      border-radius: 999px;
      background: #d4d4d8;
      position: relative;
      border: 0;
      padding: 0;
    }
    .switch.on { background: #18181b; }
    .switch i {
      position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: left 140ms ease;
    }
    .switch.on i { left: 16px; }

    .status-card {
      padding: 14px 16px 15px;
    }
    .status-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .status-kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(30,155,110,0.12);
    }
    .dot.down { background: var(--error); box-shadow: 0 0 0 4px rgba(200,45,45,0.1); }
    .dot.wait { background: var(--warning); box-shadow: 0 0 0 4px rgba(215,120,20,0.12); }
    .dot.mute { background: #a1a1aa; box-shadow: none; }
    .status-meta {
      margin: 6px 0 0 16px;
      color: var(--text-secondary);
      font-size: 12.5px;
      line-height: 1.5;
    }
    .status-meta code {
      font-family: var(--mono);
      font-size: 11.5px;
      background: var(--surface-control);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0 0;
    }
    .fact {
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--surface-control);
    }
    .fact b {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-faint);
    }
    .fact span {
      display: block;
      margin-top: 2px;
      font-size: 12.5px;
      font-weight: 550;
    }
    .status-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 13px;
    }
    .own {
      margin: 0;
      padding: 9px 12px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--surface-control) 80%, transparent);
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.45;
    }

    .steps { display: flex; flex-direction: column; }
    .step {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
    }
    .step + .step { border-top: 1px solid var(--divider); }
    .step-num {
      width: 22px; height: 22px;
      display: grid; place-items: center;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 600;
      background: var(--surface-control);
      color: var(--text-secondary);
    }
    .step.done .step-num { background: rgba(30,155,110,0.14); color: #157a57; }
    .step.now .step-num { background: #18181b; color: #fff; }

    .adv-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 2px;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
    }
    .adv-toggle em {
      font-style: normal;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-faint);
    }

    .notes {
      max-width: 1180px;
      margin: 22px auto 0;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
    }
    .notes h3 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .notes ul {
      margin: 0;
      padding-left: 18px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.6;
    }
    .notes li + li { margin-top: 4px; }
    .tag {
      display: inline-block;
      margin-right: 6px;
      padding: 0 6px;
      border-radius: 4px;
      background: #18181b;
      color: #fff;
      font-size: 10px;
      letter-spacing: 0.04em;
      vertical-align: 1px;
    }
    .tag.soft { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #18181b;
      color: #fff;
      font-size: 12.5px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: 180ms ease;
    }
    .toast.show { opacity: 1; transform: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useMemo, useState } = React;

    const ENGINES = [
      { id: "claude", label: "Claude Code CLI", icon: "assets/claude.svg" },
      { id: "codex", label: "Codex CLI", icon: "assets/codex.svg" },
      { id: "kimi", label: "Kimi CLI", icon: "assets/kimi.svg" },
      { id: "dsh", label: "DeepSeek Harness", icon: "assets/deepseek.svg" },
      { id: "grok", label: "Grok CLI", letter: "G" },
      { id: "opencode", label: "OpenCode CLI", letter: "O" },
      { id: "pi", label: "PI CLI", letter: "P" },
    ];

    const SCHEMES = [
      { id: "current", label: "当前" },
      { id: "a", label: "A 连接优先" },
      { id: "b", label: "B 三步清单" },
      { id: "c", label: "C 轻改表单" },
    ];

    const HOST_STATES = [
      { id: "connected", label: "已连接" },
      { id: "down", label: "未运行" },
      { id: "missing", label: "未安装" },
      { id: "checking", label: "检测中" },
    ];

    function Icon({ src, letter }) {
      return (
        <span className={"engine-ico" + (letter ? " letter" : "")}>
          {src ? <img src={src} alt="" /> : letter}
        </span>
      );
    }

    function Switch({ on, onClick }) {
      return (
        <button className={"switch" + (on ? " on" : "")} onClick={onClick} type="button" aria-pressed={on}>
          <i />
        </button>
      );
    }

    function BrandHeader({ hostState, onRefresh }) {
      const version = hostState === "missing" || hostState === "checking" ? null : "0.1.0-rc.6";
      return (
        <div className="brand">
          <div className="brand-main">
            <span className="brand-logo"><img src="assets/deepseek.svg" alt="" /></span>
            <div>
              <div style={{ display: "flex", alignItems: "center" }}>
                <h2 className="brand-title">DeepSeek Harness</h2>
                <a className="brand-docs" href="https://github.com/deepseek-ai/dsh" onClick={(e) => e.preventDefault()}>官方文档</a>
              </div>
            </div>
          </div>
          <div className="brand-actions">
            {hostState === "checking" && <span className="badge outline">检测中</span>}
            {hostState === "missing" && <span className="badge outline">未安装</span>}
            {version && <span className="badge">v{version}</span>}
            {hostState === "connected" && <span className="badge ok">已是最新</span>}
            {hostState === "missing" && <button className="btn sm">安装最新版</button>}
            <button className="icon-btn" onClick={onRefresh} title="重新检测">↻</button>
          </div>
        </div>
      );
    }

    function PathRow() {
      return (
        <div className="row">
          <div className="row-copy">
            <div className="row-title">可执行文件</div>
            <div className="row-help">留空则走系统 PATH 的 dsh</div>
          </div>
          <span style={{ color: "var(--text-muted)", fontSize: 12 }}>系统 PATH</span>
        </div>
      );
    }

    function CurrentPanel({ host, autoStart, setAutoStart, toast }) {
      return (
        <>
          <BrandHeader hostState={host} onRefresh={() => toast("重新检测 CLI")} />
          <div className="section-label">引擎设置</div>
          <div className="card">
            <PathRow />
            <div className="row">
              <div className="row-copy"><div className="row-title">主机</div></div>
              <input className="input" defaultValue="127.0.0.1" />
            </div>
            <div className="row">
              <div className="row-copy"><div className="row-title">端口</div></div>
              <input className="input" defaultValue="3080" />
            </div>
            <div className="row">
              <div className="row-copy"><div className="row-title">自动启动主机</div></div>
              <Switch on={autoStart} onClick={() => setAutoStart(!autoStart)} />
            </div>
            <div className="row">
              <div className="row-copy"><div className="row-title">模型来自正在运行的 DSH 主机。</div></div>
              <button className="btn outline sm" onClick={() => toast("打开 http://127.0.0.1:3080")}>打开 DSH 设置</button>
            </div>
          </div>
        </>
      );
    }

    function StatusHero({ host, toast, autoStart }) {
      if (host === "checking") {
        return (
          <div className="card status-card">
            <div className="status-kicker"><span className="dot mute" />正在探测本地 host</div>
            <div className="status-meta">只信 <code>host.describe</code>，不把 TCP 通当作已就绪。</div>
          </div>
        );
      }
      if (host === "missing") {
        return (
          <div className="card status-card">
            <div className="status-top">
              <div>
                <div className="status-kicker"><span className="dot down" />未安装 DSH CLI</div>
                <div className="status-meta">先装本地 <code>dsh</code>，模型和密钥仍然去 DSH Web UI 配，不在 mossx 里填。</div>
              </div>
            </div>
            <div className="status-actions">
              <button className="btn" onClick={() => toast("走现有 npm 安装流程")}>安装最新版</button>
              <button className="btn outline" onClick={() => toast("打开官方文档")}>安装说明</button>
            </div>
          </div>
        );
      }
      if (host === "down") {
        return (
          <div className="card status-card">
            <div className="status-kicker"><span className="dot down" />主机未运行</div>
            <div className="status-meta">
              连不上 <code>http://127.0.0.1:3080</code>。
              {autoStart ? " 已开自动启动，下次对话会尝试拉起 dsh web。" : " 自动启动已关，需要手动启动或打开开关。"}
            </div>
            <div className="status-actions">
              <button className="btn" onClick={() => toast("显式拉起 dsh web（建议补这个动作）")}>立即启动</button>
              <button className="btn outline" onClick={() => toast("打开 http://127.0.0.1:3080")}>仍尝试打开</button>
              <button className="btn ghost" onClick={() => toast("重跑 host.describe")}>重新检测</button>
            </div>
          </div>
        );
      }
      return (
        <div className="card status-card">
          <div className="status-top">
            <div>
              <div className="status-kicker"><span className="dot" />主机已连接</div>
              <div className="status-meta">
                <code>http://127.0.0.1:3080</code> · host schema 0.0.1 · 本机已有进程，mossx 会 adopt 而不是再拉一个。
              </div>
            </div>
          </div>
          <div className="facts">
            <div className="fact"><b>当前供应商</b><span>grok</span></div>
            <div className="fact"><b>当前模型</b><span>grok-4.6</span></div>
            <div className="fact"><b>已挂会话</b><span>31</span></div>
          </div>
          <div className="status-actions">
            <button className="btn" onClick={() => toast("打开 DSH Web UI 配模型 / Key")}>打开 DSH 设置</button>
            <button className="btn outline" onClick={() => toast("重跑 host.describe")}>重新检测</button>
          </div>
        </div>
      );
    }

    function ConnectionFields({ autoStart, setAutoStart, compact }) {
      return (
        <div className="card">
          <PathRow />
          <div className="row">
            <div className="row-copy">
              <div className="row-title">Host 地址</div>
              {!compact && <div className="row-help">默认本机。改端口前先确认没有别的进程占着。</div>}
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <input className="input" defaultValue="127.0.0.1" />
              <input className="input" style={{ width: 76 }} defaultValue="3080" />
            </div>
          </div>
          <div className="row">
            <div className="row-copy">
              <div className="row-title">自动启动主机</div>
              <div className="row-help">本机 host 未运行时自动拉起 dsh web，已在跑则直接 adopt。</div>
            </div>
            <Switch on={autoStart} onClick={() => setAutoStart(!autoStart)} />
          </div>
        </div>
      );
    }

    function SchemeA({ host, autoStart, setAutoStart, toast }) {
      const [openAdv, setOpenAdv] = useState(host !== "connected");
      return (
        <>
          <BrandHeader hostState={host} onRefresh={() => toast("重新检测")} />
          <StatusHero host={host} toast={toast} autoStart={autoStart} />
          <p className="own">模型和 API Key 在 DSH Web UI 里配。mossx 只负责连上这台本地 host，不会在这里加供应商。</p>
          {host !== "missing" && (
            <>
              <button className="adv-toggle" onClick={() => setOpenAdv(!openAdv)}>
                连接设置
                <em>{openAdv ? "收起" : "127.0.0.1:3080 · 自动启动开"}</em>
              </button>
              {openAdv && <ConnectionFields autoStart={autoStart} setAutoStart={setAutoStart} />}
            </>
          )}
        </>
      );
    }

    function SchemeB({ host, autoStart, setAutoStart, toast }) {
      const installed = host !== "missing" && host !== "checking";
      const running = host === "connected";
      return (
        <>
          <BrandHeader hostState={host} onRefresh={() => toast("重新检测")} />
          <div className="section-label">把 DSH 接进 mossx</div>
          <div className="card steps">
            <div className={"step" + (installed ? " done" : " now")}>
              <span className="step-num">{installed ? "✓" : "1"}</span>
              <div className="row-copy">
                <div className="row-title">安装 DSH CLI</div>
                <div className="row-help">{installed ? "已检测到 v0.1.0-rc.6" : "npm i -g @deepseek-ai/dsh，或指定本地 binary"}</div>
              </div>
              {!installed && <button className="btn sm">安装</button>}
            </div>
            <div className={"step" + (running ? " done" : installed ? " now" : "")}>
              <span className="step-num">{running ? "✓" : "2"}</span>
              <div className="row-copy">
                <div className="row-title">连上本地 host</div>
                <div className="row-help">{running ? "已 adopt 127.0.0.1:3080" : "探测 host.describe，未运行则按开关拉起"}</div>
              </div>
              {installed && !running && <button className="btn sm" onClick={() => toast("启动 host")}>启动</button>}
            </div>
            <div className={"step" + (running ? " now" : "")}>
              <span className="step-num">3</span>
              <div className="row-copy">
                <div className="row-title">在 DSH 里配模型与 Key</div>
                <div className="row-help">这一步不在 mossx。打开 Web UI 后，对话里就能选到那些模型。</div>
              </div>
              <button className="btn sm" disabled={!running} onClick={() => toast("打开 DSH 设置")}>打开 DSH</button>
            </div>
          </div>
          {running && (
            <div className="facts">
              <div className="fact"><b>当前供应商</b><span>grok</span></div>
              <div className="fact"><b>当前模型</b><span>grok-4.6</span></div>
              <div className="fact"><b>已挂会话</b><span>31</span></div>
            </div>
          )}
          <div className="section-label">连接设置</div>
          <ConnectionFields autoStart={autoStart} setAutoStart={setAutoStart} compact />
        </>
      );
    }

    function SchemeC({ host, autoStart, setAutoStart, toast }) {
      const statusLine =
        host === "connected" ? { cls: "ok", text: "主机已连接 · 127.0.0.1:3080" } :
        host === "down" ? { cls: "err", text: "主机未运行" } :
        host === "missing" ? { cls: "outline", text: "未安装 DSH CLI" } :
        { cls: "outline", text: "正在检测" };
      return (
        <>
          <BrandHeader hostState={host} onRefresh={() => toast("重新检测")} />
          <div className="section-label">引擎设置</div>
          <div className="card">
            <div className="row">
              <div className="row-copy">
                <div className="row-title">Host 状态</div>
                <div className="row-help">{host === "connected" ? "当前 grok / grok-4.6 · 31 个会话" : "模型和 Key 仍在 DSH Web UI"}</div>
              </div>
              <span className={"badge " + statusLine.cls}>{statusLine.text}</span>
            </div>
            <PathRow />
            <div className="row">
              <div className="row-copy">
                <div className="row-title">Host 地址</div>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <input className="input" defaultValue="127.0.0.1" />
                <input className="input" style={{ width: 76 }} defaultValue="3080" />
              </div>
            </div>
            <div className="row">
              <div className="row-copy">
                <div className="row-title">自动启动主机</div>
                <div className="row-help">未运行时拉起 dsh web；已在跑则 adopt。</div>
              </div>
              <Switch on={autoStart} onClick={() => setAutoStart(!autoStart)} />
            </div>
            <div className="row">
              <div className="row-copy">
                <div className="row-title">模型与 API Key</div>
                <div className="row-help">在运行中的 DSH 主机里配置，不在 mossx 添加供应商。</div>
              </div>
              <button className="btn sm" disabled={host === "missing"} onClick={() => toast("打开 DSH 设置")}>打开 DSH 设置</button>
            </div>
          </div>
        </>
      );
    }

    function App() {
      const [scheme, setScheme] = useState("a");
      const [host, setHost] = useState("connected");
      const [autoStart, setAutoStart] = useState(true);
      const [toastMsg, setToastMsg] = useState("");
      const [toastOn, setToastOn] = useState(false);

      const toast = (msg) => {
        setToastMsg(msg);
        setToastOn(true);
        window.clearTimeout(window.__dshToast);
        window.__dshToast = window.setTimeout(() => setToastOn(false), 1600);
      };

      const panel = useMemo(() => {
        const props = { host, autoStart, setAutoStart, toast };
        if (scheme === "current") return <CurrentPanel {...props} />;
        if (scheme === "b") return <SchemeB {...props} />;
        if (scheme === "c") return <SchemeC {...props} />;
        return <SchemeA {...props} />;
      }, [scheme, host, autoStart]);

      return (
        <div className="stage">
          <div className="brief">
            <div>
              <h1>DSH 这块，先把主次换过来</h1>
              <p>
                现在的 DeepSeek Harness 页把 Host / Port 当成主界面，真正要做的事——确认 host 活着、去 DSH 配模型和 Key——被挤成最后一行说明。下面四套可以点，右上角还能切「已连接 / 未运行 / 未安装」。
              </p>
            </div>
            <div className="tweak-bar">
              <div className="tweak-group">
                <span>方案</span>
                {SCHEMES.map((item) => (
                  <button key={item.id} className={scheme === item.id ? "on" : ""} onClick={() => setScheme(item.id)}>{item.label}</button>
                ))}
              </div>
              <div className="tweak-group">
                <span>状态</span>
                {HOST_STATES.map((item) => (
                  <button key={item.id} className={host === item.id ? "on" : ""} onClick={() => setHost(item.id)}>{item.label}</button>
                ))}
              </div>
            </div>
          </div>

          <div className="app-shell">
            <aside className="settings-rail">
              <div className="rail-back">← 返回应用</div>
              {["基本设置", "CLI配置管理", "快捷键", "项目管理", "Agent / Prompt"].map((label, i) => (
                <button key={label} className={"rail-item" + (i === 1 ? " active" : "")}>{label}</button>
              ))}
            </aside>
            <section className="settings-main">
              <div className="page-head">
                <h2>CLI配置管理</h2>
                <span>按引擎管理 CLI，DSH 是其中一台本地 host</span>
              </div>
              <div className="vendor-body">
                <nav className="engine-nav">
                  <div className="search">搜索 CLI</div>
                  <div className="group-label">已启用</div>
                  {ENGINES.map((engine) => (
                    <button key={engine.id} className={"engine-row" + (engine.id === "dsh" ? " active" : "")}>
                      <Icon src={engine.icon} letter={engine.letter} />
                      <span>{engine.label}</span>
                    </button>
                  ))}
                </nav>
                <div className="detail">
                  <div className="detail-inner">{panel}</div>
                </div>
              </div>
            </section>
          </div>

          <div className="notes">
            <div>
              <h3>我建议怎么改</h3>
              <ul>
                <li><span className="tag">推荐 A</span>把「host 活没活」做成第一屏。已连接时主按钮是打开 DSH；挂了就启动 / 重测。Host 和 Port 收进连接设置。</li>
                <li><span className="tag soft">B 适合首次</span>用三步讲清所有权：装 CLI → 连 host → 去 DSH 配 Key。熟了以后会显得啰嗦，可以只在未就绪时出现。</li>
                <li><span className="tag soft">C 改动最小</span>保留现有分组卡，只补状态行、合并地址、把「打开 DSH」升成主按钮。如果只想先止血，走这条。</li>
                <li>不要在 mossx 里做 DSH 供应商表。那会和 Claude/Codex 页撞车，也和「Key 归 DSH」的产品边界打架。</li>
              </ul>
            </div>
            <div>
              <h3>现有页具体别扭的点</h3>
              <ul>
                <li>「模型来自正在运行的 DSH 主机」被当成一行标题，旁边才是打开按钮。</li>
                <li>Host、Port 拆两行，还没有连接结果。</li>
                <li><code>dshHostDown</code> / <code>dshNotInstalled</code> 文案已经写了，界面没画。</li>
                <li><code>host.describe</code> 能给出 provider / model / 会话数，面板当摆设。</li>
                <li>只有自动启动开关，没有「现在就拉起」——host 挂了只能干等下次对话。</li>
              </ul>
            </div>
          </div>
          <div className={"toast" + (toastOn ? " show" : "")}>{toastMsg}</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
