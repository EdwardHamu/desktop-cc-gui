<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A · Split Composer · Git 操作面板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070707;
      --stage: #0c0c0c;
      --panel: #101010;
      --pane: #0b0b0b;
      --ink: #edeae4;
      --muted: #9c968b;
      --faint: #6a655c;
      --line: #2a2824;
      --cmd: #e8d5a3;
      --rem: #8fcb9b;
      --br: #7ba3d4;
      --opt: #d4a574;
      --op: #8a8478;
      --sans: "IBM Plex Sans", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
    body { padding: 28px 32px 80px; }
    .wrap { max-width: 1200px; margin: 0 auto; }
    .kicker { margin: 0 0 6px; color: var(--faint); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-family: var(--mono); }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 500; letter-spacing: -.04em; }
    .lede { margin: 0 0 16px; max-width: 76ch; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip { padding: 2px 8px; border: 1px solid var(--line); color: var(--faint); font: 500 11px var(--mono); }
    .ops { display: flex; gap: 2px; margin-bottom: 16px; }
    .ops button {
      appearance: none; border: 1px solid var(--line); background: transparent; color: var(--faint);
      padding: 5px 10px; font: 500 12px var(--mono); cursor: pointer;
    }
    .ops button.is-on { background: var(--ink); color: #111; }
    .stage { min-height: 700px; border: 1px solid var(--line); background: var(--stage); display: grid; place-items: start center; padding: 40px 16px 52px; }
    .dlg { width: min(920px, 100%); background: var(--panel); border: 1px solid #333029; display: grid; grid-template-rows: auto auto 1fr auto; min-height: 540px; }
    .prompt { padding: 16px 22px 0; color: var(--faint); font: 400 11px var(--mono); }
    .line { margin: 8px 22px 0; padding: 12px 0 10px; font: 500 18px/1.45 var(--mono); letter-spacing: -.03em; border-bottom: 1px solid var(--line); }
    .tok { display: inline-block; padding: 0 1px; cursor: pointer; }
    .tok:hover { background: #1b1a17; }
    .tok.is-cmd { color: var(--cmd); cursor: default; }
    .tok.is-rem { color: var(--rem); }
    .tok.is-br { color: var(--br); }
    .tok.is-opt { color: var(--opt); }
    .tok.is-op { color: var(--op); cursor: default; }
    .caret { display: inline-block; width: 8px; height: 1.05em; background: var(--ink); transform: translateY(3px); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .cols { display: grid; grid-template-columns: 320px 1fr; min-height: 340px; }
    .left { padding: 16px 22px; border-right: 1px solid var(--line); display: grid; align-content: start; gap: 14px; }
    .right { background: var(--pane); padding: 16px 22px; display: grid; align-content: start; gap: 14px; }
    .lbl { font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
    .ctl {
      width: 100%; height: 30px; padding: 0 8px; border: 1px solid var(--line);
      background: #141311; color: var(--ink); font: 500 12.5px var(--mono);
    }
    .opt { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
    .opt input { accent-color: var(--opt); }
    .rack { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip-btn {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      height: 26px; padding: 0 9px; font: 500 11.5px var(--mono); cursor: pointer;
    }
    .chip-btn.is-on { border-color: var(--opt); color: var(--opt); }
    .kv { display: grid; grid-template-columns: 72px 1fr; gap: 8px 12px; font-size: 12.5px; }
    .kv dt { color: var(--faint); font-family: var(--mono); font-size: 11px; padding-top: 2px; }
    .kv dd { margin: 0; color: var(--muted); line-height: 1.45; }
    .log { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
    .log li { display: grid; grid-template-columns: 10px 1fr; gap: 8px; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
    .mark { width: 6px; height: 6px; margin-top: 6px; background: var(--rem); }
    .mark.warn { background: var(--opt); }
    .mark.off { background: var(--faint); }
    .clist { display: grid; gap: 0; }
    .ci { display: grid; grid-template-columns: 68px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid #1d1c19; cursor: pointer; }
    .ci.is-on code, .ci.is-on b { color: var(--cmd); }
    .ci code { color: var(--opt); font: 500 11.5px var(--mono); }
    .ci b { display: block; font-size: 12.5px; font-weight: 500; }
    .ci i { font-style: normal; color: var(--faint); font-size: 11px; }
    .files { font: 500 12px/1.7 var(--mono); color: var(--muted); }
    .files .a { color: var(--rem); }
    .scope { display: grid; gap: 6px; }
    .scope div { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #1d1c19; font-size: 12.5px; }
    .scope b { font-weight: 500; } .scope span { color: var(--faint); font-family: var(--mono); font-size: 11px; }
    .foot { display: flex; gap: 8px; padding: 14px 22px 16px; border-top: 1px solid var(--line); }
    .ghost, .pri { height: 30px; padding: 0 12px; font: 500 12px var(--mono); cursor: pointer; }
    .ghost { margin-left: auto; background: transparent; border: 1px solid var(--line); color: var(--muted); }
    .pri { border: 1px solid var(--ink); background: var(--ink); color: #111; }
    .note { margin-top: 16px; color: var(--faint); font-size: 12px; }
    a { color: var(--br); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1b1a17; border: 1px solid var(--line); padding: 7px 10px; font: 500 12px var(--mono); display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">mossx · Git 操作面板选款 · A / 2</p>
    <h1>Split Composer</h1>
    <p class="lede">03 的审查台骨架，05 的纸墨与命令行。顶上一行可点 git；左栏只放参数，右栏只放 Intent / Happen / Not 与预览。适合 push 这种要核对提交的操作。</p>
    <div class="meta">
      <span class="chip">03 内容 × 05 外观</span>
      <span class="chip">L 320 / R fluid</span>
      <span class="chip">命令是标题栏</span>
    </div>
    <nav class="ops" id="ops"></nav>
    <div class="stage"><div class="dlg" id="dlg"></div></div>
    <p class="note">源稿：<a href="./03-split-inspector.html">03 Split Inspector</a> · <a href="./05-terminal-composer.html">05 Terminal Composer</a> · <a href="./index.html">返回选款</a></p>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const OPS = [["pull","pull"],["push","push"],["sync","sync"],["fetch","fetch"],["refresh","refresh"]];
    const REMOTES = ["origin", "upstream"];
    const BRANCHES = ["bump-version-0.9.1", "main", "chore/bump-version-0.9.1"];
    const COMMITS = [
      ["e8da681", "feat(session): 给大会话打开幕布加上阶段进度", "14:14:28"],
      ["34885cc", "perf(messages): 拆开大会话首屏成本并保住上翻视口", "13:38:02"],
      ["e1ec2c0", "fix(fork): 统一幕布 Fork 为 Composer 链路", "13:25:11"],
      ["89c1274", "fix(session-index): 清理超时空会话与本地草稿", "12:02:44"],
    ];
    const state = { op: "push", remote: 0, branch: 0, rebase: false, ff: false, sha: "e8da681", hooks: true, lease: false, nocommit: false, noverify: false };
    const $ = (id) => document.getElementById(id);
    const remote = () => REMOTES[state.remote];
    const branch = () => BRANCHES[state.branch];
    function tok(kind, text, action) {
      return `<span class="tok is-${kind}" ${action ? `data-cycle="${action}"` : ""}>${text}</span>`;
    }
    function kv(intent, happen, not) {
      return `<dl class="kv">
        <dt>Intent</dt><dd>${intent}</dd>
        <dt>Happen</dt><dd>${happen}</dd>
        <dt>Not</dt><dd>${not}</dd>
      </dl>`;
    }
    function log(items) {
      return `<ul class="log">${items.map(([k,t]) => `<li><i class="mark ${k}"></i><span>${t}</span></li>`).join("")}</ul>`;
    }
    function flags() {
      const bits = [];
      if (state.rebase) bits.push(" " + tok("opt", "--rebase"));
      if (state.ff) bits.push(" " + tok("opt", "--ff-only"));
      if (state.nocommit) bits.push(" " + tok("opt", "--no-commit"));
      if (state.noverify) bits.push(" " + tok("opt", "--no-verify"));
      if (state.lease) bits.push(" " + tok("opt", "--force-with-lease"));
      return bits.join("");
    }
    function render() {
      $("ops").innerHTML = OPS.map(([id,l]) => `<button data-op="${id}" class="${state.op===id?"is-on":""}">${l}</button>`).join("");
      let prompt = "", line = "", left = "", right = "", ok = "run";
      if (state.op === "pull") {
        prompt = "inspector · pull · 左参数 · 右后果";
        line = `${tok("cmd","git pull")} ${tok("rem", remote(), "remote")} ${tok("br", branch(), "branch")}${flags()}<span class="caret"></span>`;
        ok = "run pull";
        left = `
          <div><div class="lbl">远端</div><select class="ctl" data-sel="remote">${REMOTES.map((r,i)=>`<option ${i===state.remote?"selected":""}>${r}</option>`).join("")}</select></div>
          <div><div class="lbl">目标远端分支</div><select class="ctl" data-sel="branch">${BRANCHES.map((b,i)=>`<option ${i===state.branch?"selected":""}>${b}</option>`).join("")}</select></div>
          <div>
            <div class="lbl">策略</div>
            <label class="opt"><input type="radio" name="s" ${!state.rebase && !state.ff ? "checked":""} data-s="cfg" /> 按仓库配置</label>
            <label class="opt"><input type="radio" name="s" ${state.rebase ? "checked":""} data-s="rebase" /> rebase</label>
            <label class="opt"><input type="radio" name="s" ${state.ff ? "checked":""} data-s="ff" /> ff-only</label>
          </div>
          <div>
            <div class="lbl">附加</div>
            <div class="rack">
              <button class="chip-btn ${state.nocommit?"is-on":""}" data-t="nocommit">--no-commit</button>
              <button class="chip-btn ${state.noverify?"is-on":""}" data-t="noverify">--no-verify</button>
            </div>
          </div>`;
        right = `
          ${kv(
            "把远端提交接到当前分支。",
            state.rebase ? "本地新提交接到远端之后，hash 可能变化。" : state.ff ? "只能快进；分叉则停止。" : "读取当前仓库配置，结果可能因仓库而异。",
            "不会 push。" + (state.rebase ? " 不创建 merge commit。" : state.ff ? " 不会 rebase，也不会自动合并分叉。" : " 未指定策略时不承诺 merge 或 rebase。")
          )}
          ${log([["","更新 refs/remotes/" + remote() + "/" + branch()],[state.ff?"warn":"","尝试更新本地 " + branch()],["off","工作区未提交改动若冲突会停下"]])}`;
      } else if (state.op === "push") {
        prompt = "inspector · push · 审查提交再发出";
        line = `${tok("cmd","git push")} ${state.lease?tok("opt","--force-with-lease")+" ":""}${tok("rem", remote(), "remote")} ${tok("br", branch(), "branch")}<span class="caret"></span>`;
        ok = "run push";
        left = `
          <div><div class="lbl">远端</div><select class="ctl" data-sel="remote">${REMOTES.map((r,i)=>`<option ${i===state.remote?"selected":""}>${r}</option>`).join("")}</select></div>
          <div><div class="lbl">目标远端分支</div><select class="ctl" data-sel="branch">${BRANCHES.map((b,i)=>`<option ${i===state.branch?"selected":""}>${b}</option>`).join("")}</select></div>
          <div>
            <div class="lbl">保护</div>
            <div class="rack">
              <button class="chip-btn ${state.hooks?"is-on":""}" data-t="hooks">hooks</button>
              <button class="chip-btn ${state.lease?"is-on":""}" data-t="lease">--force-with-lease</button>
            </div>
          </div>
          <div class="files">
            <div class="lbl">选中提交文件 · 41</div>
            <div>A  spec.md <span class="a">+68</span></div>
            <div>A  .openspec.yaml <span class="a">+2</span></div>
            <div>A  design.md <span class="a">+114</span></div>
          </div>`;
        right = `
          ${kv("把本地提交送到远端。", state.lease ? "lease 保护：远端若被别人推进则会拒绝。" : "普通推送，不改写远端历史。", "不会改本地工作区。")}
          <div class="lbl">本次推送 · 展示最近 120</div>
          <div class="clist">
            ${COMMITS.map(([sha,msg,t]) => `<div class="ci ${state.sha===sha?"is-on":""}" data-sha="${sha}"><code>${sha}</code><div><b>${msg}</b><i>chenxiangning · ${t}</i></div></div>`).join("")}
          </div>
          ${log([["","4 个本地提交将出现在 " + remote()],[state.hooks?"":"off", state.hooks ? "pre-push 挂钩会运行" : "已跳过挂钩"]])}`;
      } else if (state.op === "sync") {
        prompt = "inspector · sync · 两步写死";
        line = `${tok("cmd","git pull")} ${tok("op","&&")} ${tok("cmd","git push")}<span class="caret"></span>`;
        ok = "run sync";
        left = `<div class="scope">
          <div><b>本地</b><span>bump-version-0.9.1</span></div>
          <div><b>远端</b><span>upstream</span></div>
          <div><b>目标</b><span>chore/bump-version-0.9.1</span></div>
          <div><b>ahead / behind</b><span>3 / 0</span></div>
        </div>`;
        right = `${kv("先拉后推，把当前分支与远端对齐。","1. pull upstream/chore/bump-version-0.9.1　2. push 本地 3 个提交。","不继承拉取对话框的 --rebase / --ff-only。")}${log([["","顺序固定：pull 然后 push"],["off","自定义拉取策略不会跟过来"]])}`;
      } else if (state.op === "fetch") {
        prompt = "inspector · fetch · 只更新对照";
        line = `${tok("cmd","git fetch")} ${tok("opt","--all")}<span class="caret"></span>`;
        ok = "run fetch";
        left = `<div class="scope"><div><b>作用域</b><span>all remotes</span></div><div><b>origin</b><span>github.com/codemoss</span></div><div><b>upstream</b><span>github.com/upstream</span></div></div>`;
        right = `${kv("更新对照用的远端引用。","刷新 refs/remotes/*。","不更新 HEAD，不改工作区。")}${log([["","origin + upstream"],["off","当前分支不动"]])}`;
      } else {
        prompt = "inspector · refresh · 本地重读";
        line = `<span class="tok is-cmd">refreshAll()</span><span class="caret"></span>`;
        ok = "run refresh";
        left = `<div class="scope"><div><b>分支树</b><span>reload</span></div><div><b>提交图</b><span>reload</span></div><div><b>详情 / diff</b><span>reload</span></div></div>`;
        right = `${kv("重载 Git History 面板数据。","重读本地 Git 与面板缓存。","不发起 pull / push / fetch。")}${log([["","branches · graph · details"],["off","远端数字不会变新"]])}`;
      }
      $("dlg").innerHTML = `
        <div class="prompt">${prompt}</div>
        <div class="line">${line}</div>
        <div class="cols"><div class="left">${left}</div><div class="right">${right}</div></div>
        <div class="foot"><button class="ghost" data-act="cancel">esc</button><button class="pri" data-act="ok">${ok}</button></div>`;
    }
    document.body.addEventListener("click", (e) => {
      const op = e.target.closest("[data-op]"); if (op) { state.op = op.dataset.op; render(); return; }
      const cyc = e.target.closest("[data-cycle]");
      if (cyc) {
        if (cyc.dataset.cycle === "remote") state.remote = (state.remote + 1) % REMOTES.length;
        if (cyc.dataset.cycle === "branch") state.branch = (state.branch + 1) % BRANCHES.length;
        render(); return;
      }
      const t = e.target.closest("[data-t]"); if (t) { state[t.dataset.t] = !state[t.dataset.t]; render(); return; }
      const sha = e.target.closest("[data-sha]"); if (sha) { state.sha = sha.dataset.sha; render(); return; }
      const act = e.target.closest("[data-act]");
      if (act) { const toast=$("toast"); toast.textContent = act.dataset.act==="ok"?`$ ${state.op}`:"^C"; toast.style.display="block"; setTimeout(()=>toast.style.display="none",1400); }
    });
    document.body.addEventListener("change", (e) => {
      const sel = e.target.closest("[data-sel]");
      if (sel) {
        if (sel.dataset.sel === "remote") state.remote = REMOTES.indexOf(sel.value);
        if (sel.dataset.sel === "branch") state.branch = BRANCHES.indexOf(sel.value);
        render(); return;
      }
      if (e.target.dataset.s === "rebase") { state.rebase = true; state.ff = false; render(); }
      if (e.target.dataset.s === "ff") { state.ff = true; state.rebase = false; render(); }
      if (e.target.dataset.s === "cfg") { state.ff = false; state.rebase = false; render(); }
    });
    render();
  </script>
</body>
</html>
