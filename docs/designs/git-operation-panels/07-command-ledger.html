<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>B · Command Ledger · Git 操作面板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070707;
      --stage: #0c0c0c;
      --panel: #101010;
      --ink: #edeae4;
      --muted: #9c968b;
      --faint: #6a655c;
      --line: #2a2824;
      --cmd: #e8d5a3;
      --rem: #8fcb9b;
      --br: #7ba3d4;
      --opt: #d4a574;
      --op: #8a8478;
      --sans: "IBM Plex Sans", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--mono); }
    body { padding: 28px 32px 80px; }
    .wrap { max-width: 1120px; margin: 0 auto; }
    .kicker { margin: 0 0 6px; color: var(--faint); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 500; letter-spacing: -.04em; font-family: var(--sans); }
    .lede { margin: 0 0 16px; max-width: 76ch; color: var(--muted); font-size: 13px; line-height: 1.6; font-family: var(--sans); }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip { padding: 2px 8px; border: 1px solid var(--line); color: var(--faint); font-size: 11px; }
    .ops { display: flex; gap: 2px; margin-bottom: 16px; }
    .ops button {
      appearance: none; border: 1px solid var(--line); background: transparent; color: var(--faint);
      padding: 5px 10px; font: 500 12px var(--mono); cursor: pointer;
    }
    .ops button.is-on { background: var(--ink); color: #111; }
    .stage { min-height: 700px; border: 1px solid var(--line); background: var(--stage); display: grid; place-items: start center; padding: 44px 16px 56px; }
    .dlg { width: min(820px, 100%); background: var(--panel); border: 1px solid #333029; }
    .prompt { padding: 18px 22px 8px; color: var(--faint); font-size: 11px; }
    .line {
      margin: 0 22px; padding: 16px 0 10px; font-size: 20px; line-height: 1.45; letter-spacing: -.03em;
      border-bottom: 1px solid var(--line);
    }
    .tok { display: inline-block; padding: 0 1px; cursor: pointer; }
    .tok:hover { background: #1b1a17; }
    .tok.is-cmd { color: var(--cmd); cursor: default; }
    .tok.is-rem { color: var(--rem); }
    .tok.is-br { color: var(--br); }
    .tok.is-opt { color: var(--opt); }
    .tok.is-op { color: var(--op); cursor: default; }
    .caret { display: inline-block; width: 8px; height: 1.05em; background: var(--ink); transform: translateY(3px); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .ann { display: flex; flex-wrap: wrap; gap: 18px; padding: 10px 22px 0; color: var(--faint); font-size: 11px; }
    .ann b { color: var(--muted); font-weight: 500; }
    .rack { padding: 16px 22px 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .chip-btn {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      height: 26px; padding: 0 9px; font: 500 11.5px var(--mono); cursor: pointer;
    }
    .chip-btn.is-on { border-color: var(--opt); color: var(--opt); }
    .ledger {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;
      margin: 16px 22px 0; border-top: 1px solid var(--line);
    }
    .cell { padding: 12px 14px 12px 0; }
    .cell + .cell { padding-left: 14px; border-left: 1px solid var(--line); }
    .cell h3 { margin: 0 0 8px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
    .cell p { margin: 0; font-family: var(--sans); font-size: 13px; line-height: 1.5; color: var(--muted); }
    .side { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 16px 22px 0; }
    .blk h3 { margin: 0 0 8px; font-size: 11px; color: var(--faint); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
    .ci, .fi { padding: 7px 0; border-bottom: 1px solid #1d1c19; cursor: pointer; }
    .ci.is-on, .ci.is-on b { color: var(--cmd); }
    .ci b, .fi b { display: block; font-size: 12.5px; font-weight: 500; font-family: var(--sans); color: var(--ink); }
    .ci.is-on b { color: var(--cmd); }
    .ci i, .fi i { font-style: normal; color: var(--faint); font-size: 11px; }
    .scope { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; padding: 14px 22px 0; }
    .scope div { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #1d1c19; font-size: 12px; }
    .scope span { color: var(--faint); }
    .foot { display: flex; gap: 8px; padding: 20px 22px 18px; }
    .ghost, .pri { height: 30px; padding: 0 12px; font: 500 12px var(--mono); cursor: pointer; }
    .ghost { margin-left: auto; background: transparent; border: 1px solid var(--line); color: var(--muted); }
    .pri { border: 1px solid var(--ink); background: var(--ink); color: #111; }
    .note { margin-top: 16px; color: var(--faint); font-size: 12px; font-family: var(--sans); }
    a { color: var(--br); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1b1a17; border: 1px solid var(--line); padding: 7px 10px; font-size: 12px; display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">mossx · Git 操作面板选款 · B / 2</p>
    <h1>Command Ledger</h1>
    <p class="lede">05 的命令画布当主角，03 的 Intent / Happen / Not 摊成三栏账本。不左右分栏。点 token 改远端和分支，点 chip 把 flag 嵌进命令，账本跟着变。</p>
    <div class="meta">
      <span class="chip">03 内容 × 05 外观</span>
      <span class="chip">命令是产品</span>
      <span class="chip">三栏账本</span>
    </div>
    <nav class="ops" id="ops"></nav>
    <div class="stage"><div class="dlg" id="dlg"></div></div>
    <p class="note">源稿：<a href="./03-split-inspector.html">03 Split Inspector</a> · <a href="./05-terminal-composer.html">05 Terminal Composer</a> · <a href="./index.html">返回选款</a></p>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const OPS = [["pull","pull"],["push","push"],["sync","sync"],["fetch","fetch"],["refresh","refresh"]];
    const REMOTES = ["origin", "upstream"];
    const BRANCHES = ["bump-version-0.9.1", "main", "chore/bump-version-0.9.1"];
    const FLAGS = ["--rebase", "--ff-only", "--no-commit", "--no-verify"];
    const COMMITS = [
      ["e8da681", "feat(session): 给大会话打开幕布加上阶段进度", "14:14:28"],
      ["34885cc", "perf(messages): 拆开大会话首屏成本并保住上翻视口", "13:38:02"],
      ["e1ec2c0", "fix(fork): 统一幕布 Fork 为 Composer 链路", "13:25:11"],
      ["89c1274", "fix(session-index): 清理超时空会话与本地草稿", "12:02:44"],
    ];
    const state = { op: "pull", remote: 0, branch: 0, flags: new Set(["--rebase"]), sha: "e8da681", hooks: true, lease: false };
    const $ = (id) => document.getElementById(id);
    const remote = () => REMOTES[state.remote];
    const branch = () => BRANCHES[state.branch];
    function tok(kind, text, action) {
      return `<span class="tok is-${kind}" ${action ? `data-cycle="${action}"` : ""}>${text}</span>`;
    }
    function ledger(intent, happen, not) {
      return `<div class="ledger">
        <div class="cell"><h3>Intent</h3><p>${intent}</p></div>
        <div class="cell"><h3>Will Happen</h3><p>${happen}</p></div>
        <div class="cell"><h3>Will NOT</h3><p>${not}</p></div>
      </div>`;
    }
    function foot(label) {
      return `<div class="foot"><button class="ghost" data-act="cancel">esc</button><button class="pri" data-act="ok">${label}</button></div>`;
    }
    function strategy() {
      if (state.flags.has("--rebase")) return "rebase";
      if (state.flags.has("--ff-only")) return "ff-only";
      return "config";
    }
    function extras() {
      return [...state.flags].map((f) => " " + tok("opt", f, "flag:"+f)).join("");
    }
    function render() {
      $("ops").innerHTML = OPS.map(([id,l]) => `<button data-op="${id}" class="${state.op===id?"is-on":""}">${l}</button>`).join("");
      const d = $("dlg");
      if (state.op === "pull") {
        const happen = state.flags.has("--rebase")
          ? "本地新提交接到远端之后，hash 可能变化。"
          : state.flags.has("--ff-only")
            ? "只能快进；分叉则停止。"
            : "读取当前仓库配置，结果可能因仓库而异。";
        const not = state.flags.has("--rebase")
          ? "不会 push，不创建 merge commit。"
          : state.flags.has("--ff-only")
            ? "不会 rebase，也不会自动合并分叉。不会 push。"
            : "不会 push。未指定策略时不承诺 merge 或 rebase。";
        d.innerHTML = `
          <div class="prompt">composer · pull · click a token to cycle</div>
          <div class="line">${tok("cmd","git pull")} ${tok("rem", remote(), "remote")} ${tok("br", branch(), "branch")}${extras()}<span class="caret"></span></div>
          <div class="ann"><span>remote <b>${remote()}</b></span><span>branch <b>${branch()}</b></span><span>integrate <b>${strategy()}</b></span></div>
          <div class="rack">${FLAGS.map((f) => `<button class="chip-btn ${state.flags.has(f)?"is-on":""}" data-flag="${f}">${f}</button>`).join("")}</div>
          ${ledger("把远端提交接到当前分支。", happen, not)}
          ${foot("run pull")}`;
      } else if (state.op === "push") {
        d.innerHTML = `
          <div class="prompt">composer · push · ${state.lease ? "force-with-lease" : "fast-forward"}</div>
          <div class="line">${tok("cmd","git push")} ${state.lease?tok("opt","--force-with-lease")+" ":""}${tok("rem", remote(), "remote")} ${tok("br", branch(), "branch")}<span class="caret"></span></div>
          <div class="ann"><span>src <b>bump-version-0.9.1</b></span><span>dst <b>${remote()}:${branch()}</b></span><span>ahead <b>4</b></span></div>
          <div class="rack">
            <button class="chip-btn ${state.hooks?"is-on":""}" data-t="hooks">hooks</button>
            <button class="chip-btn ${state.lease?"is-on":""}" data-t="lease">--force-with-lease</button>
          </div>
          ${ledger("把本地提交送到远端。", state.lease ? "lease 保护：远端若被别人推进则会拒绝。" : "普通推送，不改写远端历史。", "不会改本地工作区。")}
          <div class="side">
            <div class="blk">
              <h3>outgoing · 4</h3>
              ${COMMITS.map(([sha,msg,t]) => `<div class="ci ${state.sha===sha?"is-on":""}" data-sha="${sha}"><b>${msg}</b><i>${sha} · chenxiangning · ${t}</i></div>`).join("")}
            </div>
            <div class="blk">
              <h3>files in ${state.sha}</h3>
              <div class="fi"><b>A  spec.md</b><i>+68 −0</i></div>
              <div class="fi"><b>A  .openspec.yaml</b><i>+2 −0</i></div>
              <div class="fi"><b>A  design.md</b><i>+114 −0</i></div>
            </div>
          </div>
          ${foot("run push")}`;
      } else if (state.op === "sync") {
        d.innerHTML = `
          <div class="prompt">composer · sync · sequential</div>
          <div class="line">${tok("cmd","git pull")} ${tok("op","&&")} ${tok("cmd","git push")}<span class="caret"></span></div>
          <div class="ann"><span>local <b>bump-version-0.9.1</b></span><span>remote <b>upstream:chore/bump-version-0.9.1</b></span><span>ahead/behind <b>3 / 0</b></span></div>
          <div class="scope">
            <div><b>本地</b><span>bump-version-0.9.1</span></div>
            <div><b>远端</b><span>upstream</span></div>
            <div><b>目标</b><span>chore/bump-version-0.9.1</span></div>
            <div><b>ahead / behind</b><span>3 / 0</span></div>
          </div>
          ${ledger("先拉后推，把当前分支与远端对齐。","1. pull　2. push 本地 3 个提交。","不继承拉取对话框的 --rebase / --ff-only。")}
          ${foot("run sync")}`;
      } else if (state.op === "fetch") {
        d.innerHTML = `
          <div class="prompt">composer · fetch · metadata</div>
          <div class="line">${tok("cmd","git fetch")} ${tok("opt","--all")}<span class="caret"></span></div>
          <div class="ann"><span>scope <b>origin + upstream</b></span><span>writes <b>refs/remotes/*</b></span><span>HEAD <b>untouched</b></span></div>
          <div class="scope">
            <div><b>origin</b><span>github.com/codemoss</span></div>
            <div><b>upstream</b><span>github.com/upstream</span></div>
          </div>
          ${ledger("更新对照用的远端引用。","刷新 refs/remotes/*。","不更新 HEAD，不改工作区。")}
          ${foot("run fetch")}`;
      } else {
        d.innerHTML = `
          <div class="prompt">composer · refresh · local</div>
          <div class="line"><span class="tok is-cmd">refreshAll()</span><span class="caret"></span></div>
          <div class="ann"><span>network <b>none</b></span><span>reloads <b>branches · graph · details</b></span></div>
          <div class="scope">
            <div><b>分支树</b><span>reload</span></div>
            <div><b>提交图</b><span>reload</span></div>
            <div><b>详情 / diff</b><span>reload</span></div>
            <div><b>网络</b><span>none</span></div>
          </div>
          ${ledger("重载 Git History 面板数据。","重读本地 Git 与面板缓存。","不发起 pull / push / fetch。")}
          ${foot("run refresh")}`;
      }
    }
    document.body.addEventListener("click", (e) => {
      const op = e.target.closest("[data-op]"); if (op) { state.op = op.dataset.op; render(); return; }
      const cyc = e.target.closest("[data-cycle]");
      if (cyc) {
        const v = cyc.dataset.cycle;
        if (v === "remote") state.remote = (state.remote + 1) % REMOTES.length;
        if (v === "branch") state.branch = (state.branch + 1) % BRANCHES.length;
        render(); return;
      }
      const f = e.target.closest("[data-flag]");
      if (f) {
        const v = f.dataset.flag;
        if (state.flags.has(v)) state.flags.delete(v); else {
          if (v === "--rebase" || v === "--ff-only") {
            ["--rebase","--ff-only"].forEach((x) => state.flags.delete(x));
          }
          state.flags.add(v);
        }
        render(); return;
      }
      const t = e.target.closest("[data-t]"); if (t) { state[t.dataset.t] = !state[t.dataset.t]; render(); return; }
      const sha = e.target.closest("[data-sha]"); if (sha) { state.sha = sha.dataset.sha; render(); return; }
      const act = e.target.closest("[data-act]");
      if (act) { const toast=$("toast"); toast.textContent = act.dataset.act==="ok"?`$ ${state.op}`:"^C"; toast.style.display="block"; setTimeout(()=>toast.style.display="none",1400); }
    });
    render();
  </script>
</body>
</html>
