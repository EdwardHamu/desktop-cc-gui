<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>03 · Split Inspector · Git 操作面板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c1014;
      --stage: #10151b;
      --panel: #141b22;
      --pane: #0f141a;
      --ink: #e7edf3;
      --muted: #93a0ad;
      --faint: #667482;
      --line: #24303a;
      --cyan: #4ec9b0;
      --blue: #6cb6ff;
      --gold: #d7ba7d;
      --red: #f14c4c;
      --sans: "IBM Plex Sans", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
    body { padding: 28px 32px 80px; }
    .wrap { max-width: 1200px; margin: 0 auto; }
    .kicker { margin: 0 0 6px; color: var(--faint); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -.03em; }
    .lede { margin: 0 0 16px; max-width: 76ch; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip { padding: 3px 9px; border: 1px solid var(--line); border-radius: 4px; color: var(--faint); font-size: 11px; font-family: var(--mono); }
    .ops { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
    .ops button {
      appearance: none; border: 0; background: transparent; color: var(--faint);
      padding: 8px 14px; font: 500 12.5px/1 var(--sans); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .ops button.is-on { color: var(--ink); border-bottom-color: var(--cyan); }
    .stage { min-height: 700px; border: 1px solid var(--line); border-radius: 10px; background: var(--stage); display: grid; place-items: start center; padding: 36px 16px 48px; }
    .dlg {
      width: min(920px, 100%); background: var(--panel); border: 1px solid #2c3a46; border-radius: 10px;
      box-shadow: 0 24px 70px rgba(0,0,0,.45); display: grid; grid-template-rows: auto 1fr auto; min-height: 520px;
    }
    .dlg-h { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .dlg-h b { font-size: 13.5px; }
    .dlg-h code { margin-left: auto; font: 500 11.5px var(--mono); color: var(--blue); }
    .cols { display: grid; grid-template-columns: 340px 1fr; min-height: 400px; }
    .left { padding: 14px 16px; border-right: 1px solid var(--line); display: grid; align-content: start; gap: 12px; }
    .right { background: var(--pane); padding: 14px 16px; display: grid; align-content: start; gap: 12px; }
    .lbl { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
    .ctl { width: 100%; height: 32px; padding: 0 9px; border-radius: 4px; border: 1px solid var(--line); background: #182028; color: var(--ink); font: 500 12.5px var(--sans); }
    .opt { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
    .opt input { accent-color: var(--cyan); }
    .kv { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; font-size: 12.5px; }
    .kv dt { color: var(--faint); } .kv dd { margin: 0; }
    .cmd { padding: 10px 12px; background: #0b0f13; border: 1px solid var(--line); border-radius: 4px; font: 500 12px/1.5 var(--mono); }
    .c-cmd { color: var(--blue); } .c-ok { color: var(--cyan); } .c-br { color: var(--gold); } .c-op { color: #c586c0; }
    .log { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .log li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
    .mark { width: 8px; height: 8px; margin-top: 5px; background: var(--cyan); }
    .mark.warn { background: var(--gold); } .mark.off { background: var(--faint); }
    .clist { display: grid; gap: 2px; }
    .ci { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 7px 8px; border-radius: 4px; cursor: pointer; }
    .ci.is-on { background: #1b2833; }
    .ci code { color: var(--gold); font-size: 11.5px; }
    .ci b { display: block; font-size: 12.5px; font-weight: 500; }
    .ci i { font-style: normal; color: var(--faint); font-size: 11px; }
    .files { font: 500 12px/1.7 var(--mono); }
    .a { color: var(--cyan); } .d { color: var(--red); }
    .scope { display: grid; gap: 6px; }
    .scope div { display: flex; justify-content: space-between; padding: 7px 9px; background: #182028; border: 1px solid var(--line); border-radius: 4px; font-size: 12.5px; }
    .scope b { font-weight: 500; } .scope span { color: var(--faint); font-family: var(--mono); font-size: 11px; }
    .foot { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
    .ghost, .pri { height: 30px; padding: 0 13px; border-radius: 4px; font: 500 12.5px var(--sans); cursor: pointer; }
    .ghost { margin-left: auto; background: transparent; border: 1px solid var(--line); color: var(--muted); }
    .pri { border: 0; background: var(--cyan); color: #06221b; }
    .note { margin-top: 16px; color: var(--faint); font-size: 12px; }
    a { color: var(--blue); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1b2833; border: 1px solid var(--line); padding: 7px 11px; font: 500 12px var(--mono); display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">mossx · Git 操作面板选款 · 03 / 05</p>
    <h1>Split Inspector</h1>
    <p class="lede">VS Code merge editor / GitHub PR 审查台。左栏只放参数，右栏只放后果与预览。推送面板已经是这个结构——这套把它做成全操作家族的语法。</p>
    <div class="meta">
      <span class="chip">inspector</span>
      <span class="chip">L 340 / R fluid</span>
      <span class="chip">cool slate + cyan</span>
    </div>
    <nav class="ops" id="ops"></nav>
    <div class="stage"><div class="dlg" id="dlg"></div></div>
    <p class="note">假设：推送预览的提交列表 / 文件树保留现有数据契约，只换壳。<a href="./index.html">返回选款</a></p>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const OPS = [["pull","拉取"],["push","推送"],["sync","同步"],["fetch","获取"],["refresh","刷新"]];
    const COMMITS = [
      ["e8da681", "feat(session): 给大会话打开幕布加上阶段进度", "14:14:28"],
      ["34885cc", "perf(messages): 拆开大会话首屏成本并保住上翻视口", "13:38:02"],
      ["e1ec2c0", "fix(fork): 统一幕布 Fork 为 Composer 链路", "13:25:11"],
      ["89c1274", "fix(session-index): 清理超时空会话与本地草稿", "12:02:44"],
    ];
    const state = { op: "push", rebase: false, ff: false, sha: "e8da681", hooks: true, lease: false };
    const $ = (id) => document.getElementById(id);
    function cmd(html) { return `<div class="cmd">${html}</div>`; }
    function log(items) {
      return `<ul class="log">${items.map(([k,t]) => `<li><i class="mark ${k}"></i><span>${t}</span></li>`).join("")}</ul>`;
    }
    function render() {
      $("ops").innerHTML = OPS.map(([id,l]) => `<button data-op="${id}" class="${state.op===id?"is-on":""}">${l}</button>`).join("");
      let left = "", right = "", title = "", example = "", ok = "确认";
      if (state.op === "pull") {
        title = "拉取变更"; example = "git pull origin bump-version-0.9.1"; ok = "拉取";
        left = `
          <div><div class="lbl">远端</div><select class="ctl"><option>origin</option><option>upstream</option></select></div>
          <div><div class="lbl">目标远端分支</div><input class="ctl" value="bump-version-0.9.1" /></div>
          <div>
            <div class="lbl">策略</div>
            <label class="opt"><input type="radio" name="s" ${!state.rebase && !state.ff ? "checked":""} data-s="cfg" /> 按仓库配置</label>
            <label class="opt"><input type="radio" name="s" ${state.rebase ? "checked":""} data-s="rebase" /> rebase</label>
            <label class="opt"><input type="radio" name="s" ${state.ff ? "checked":""} data-s="ff" /> ff-only</label>
          </div>
          <div>
            <div class="lbl">附加</div>
            <label class="opt"><input type="checkbox" /> --no-commit</label>
            <label class="opt"><input type="checkbox" /> --no-verify</label>
          </div>`;
        right = `
          ${cmd(`<span class="c-cmd">git pull</span> <span class="c-ok">origin</span> <span class="c-br">bump-version-0.9.1</span>${state.rebase?" <span class='c-op'>--rebase</span>":""}${state.ff?" <span class='c-op'>--ff-only</span>":""}`)}
          <dl class="kv">
            <dt>Intent</dt><dd>把远端提交接到当前分支。</dd>
            <dt>Happen</dt><dd>${state.rebase ? "本地新提交接到远端之后。" : state.ff ? "只能快进；分叉则停止。" : "读取当前仓库配置，结果可能因仓库而异。"}</dd>
            <dt>Not</dt><dd>不会 push。未指定策略时不承诺 merge 或 rebase。</dd>
          </dl>
          ${log([["","更新 refs/remotes/origin/bump-version-0.9.1"],[state.ff?"warn":"","尝试更新本地 bump-version-0.9.1"],["off","工作区未提交改动若冲突会停下"]])}`;
      } else if (state.op === "push") {
        title = "将提交推送到远端"; example = "git push origin bump-version-0.9.1"; ok = "推送";
        left = `
          <div><div class="lbl">远端</div><select class="ctl"><option>origin</option><option>upstream</option></select></div>
          <div><div class="lbl">目标远端分支</div><input class="ctl" value="bump-version-0.9.1" /></div>
          <div>
            <div class="lbl">保护</div>
            <label class="opt"><input type="checkbox" ${state.hooks?"checked":""} data-t="hooks" /> 运行 Git 挂钩</label>
            <label class="opt"><input type="checkbox" ${state.lease?"checked":""} data-t="lease" /> Force with lease</label>
            <label class="opt"><input type="checkbox" /> 推送标签</label>
            <label class="opt"><input type="checkbox" /> Push to Gerrit</label>
          </div>
          <div class="files">
            <div class="lbl">选中提交文件 · 41</div>
            <div>A  spec.md <span class="a">+68</span></div>
            <div>A  .openspec.yaml <span class="a">+2</span></div>
            <div>A  design.md <span class="a">+114</span></div>
          </div>`;
        right = `
          ${cmd(`<span class="c-br">bump-version-0.9.1</span> <span style="color:#667482">-></span> <span class="c-ok">origin</span>:<span class="c-br">bump-version-0.9.1</span>`)}
          <div class="lbl">本次推送 · 展示最近 120</div>
          <div class="clist">
            ${COMMITS.map(([sha,msg,t]) => `<div class="ci ${state.sha===sha?"is-on":""}" data-sha="${sha}"><code>${sha}</code><div><b>${msg}</b><i>chenxiangning · ${t}</i></div></div>`).join("")}
          </div>
          ${log([["","4 个本地提交将出现在 origin"],[state.lease?"warn":"off", state.lease ? "lease 保护：远端若被别人推进则会拒绝" : "普通推送，不改写远端历史"],[state.hooks?"":"off", state.hooks ? "pre-push 挂钩会运行" : "已跳过挂钩"]])}`;
      } else if (state.op === "sync") {
        title = "同步分支"; example = "git pull && git push"; ok = "同步";
        left = `
          <div class="scope">
            <div><b>本地</b><span>bump-version-0.9.1</span></div>
            <div><b>远端</b><span>upstream</span></div>
            <div><b>目标</b><span>chore/bump-version-0.9.1</span></div>
            <div><b>ahead / behind</b><span>3 / 0</span></div>
          </div>`;
        right = `
          ${cmd(`<span class="c-cmd">git pull</span> <span style="color:#667482">&&</span> <span class="c-cmd">git push</span>`)}
          ${log([["","1. pull upstream/chore/bump-version-0.9.1"],["","2. push 本地 3 个提交"],["off","不继承拉取对话框的 --rebase / --ff-only"]])}`;
      } else if (state.op === "fetch") {
        title = "获取远端更新"; example = "git fetch --all"; ok = "获取";
        left = `<div class="scope"><div><b>作用域</b><span>all remotes</span></div><div><b>origin</b><span>github.com/codemoss</span></div><div><b>upstream</b><span>github.com/upstream</span></div></div>`;
        right = `${cmd(`<span class="c-cmd">git fetch</span> <span class="c-op">--all</span>`)}${log([["","刷新 refs/remotes/*"],["off","不更新 HEAD"],["off","不改工作区"]])}`;
      } else {
        title = "刷新历史面板"; example = "refreshAll()"; ok = "刷新";
        left = `<div class="scope"><div><b>分支树</b><span>reload</span></div><div><b>提交图</b><span>reload</span></div><div><b>详情 / diff</b><span>reload</span></div></div>`;
        right = `${cmd(`<span style="color:#93a0ad">refreshAll()</span>`)}${log([["","重读本地 Git 与面板缓存"],["off","不发起 pull / push / fetch"]])}`;
      }
      $("dlg").innerHTML = `
        <div class="dlg-h"><b>${title}</b><code>${example}</code></div>
        <div class="cols"><div class="left">${left}</div><div class="right">${right}</div></div>
        <div class="foot"><button class="ghost" data-act="cancel">取消</button><button class="pri" data-act="ok">${ok}</button></div>`;
    }
    document.body.addEventListener("click", (e) => {
      const op = e.target.closest("[data-op]"); if (op) { state.op = op.dataset.op; render(); return; }
      const sha = e.target.closest("[data-sha]"); if (sha) { state.sha = sha.dataset.sha; render(); return; }
      const act = e.target.closest("[data-act]");
      if (act) { const t=$("toast"); t.textContent = act.dataset.act==="ok"?`已确认 · ${state.op}`:"已取消"; t.style.display="block"; setTimeout(()=>t.style.display="none",1400); }
    });
    document.body.addEventListener("change", (e) => {
      if (e.target.dataset.s === "rebase") { state.rebase = true; state.ff = false; render(); }
      if (e.target.dataset.s === "ff") { state.ff = true; state.rebase = false; render(); }
      if (e.target.dataset.s === "cfg") { state.ff = false; state.rebase = false; render(); }
      if (e.target.dataset.t) { state[e.target.dataset.t] = e.target.checked; render(); }
    });
    render();
  </script>
</body>
</html>
