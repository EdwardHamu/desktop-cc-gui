<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>09 · 八段时钟</title>
  <style>
    :root {
      --text-stronger: #d9d9d9; --text-muted: #b3b3b3;
      --text-thinking: rgb(115,115,115);
      --surface-messages: oklch(0.141 0.005 285.823);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--surface-messages); color: #e6e7ea;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    .stage { width: min(420px, 88vw); }
    .label { margin: 0 0 18px; color: #808080; font-size: 11px; letter-spacing: 0.04em; }
    .think { display: flex; align-items: center; gap: 8px; min-height: 28px; color: var(--text-thinking); }
    .build { margin: 2px 0 10px 22px; color: var(--text-thinking); }
    .working { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; }
    .working-timer { color: var(--text-stronger); font-variant-numeric: tabular-nums; }
    .working-text { color: var(--text-muted); }
    .sp { width: 14px; height: 14px; position: relative; }
    .sp i {
      position: absolute; left: 6.25px; top: 0; width: 1.5px; height: 4px;
      border-radius: 1px; background: var(--text-stronger);
      transform-origin: 50% 7px;
      animation: tick 0.96s linear infinite;
    }
    .sp i:nth-child(1) { transform: rotate(0deg); animation-delay: 0s; }
    .sp i:nth-child(2) { transform: rotate(45deg); animation-delay: -.12s; }
    .sp i:nth-child(3) { transform: rotate(90deg); animation-delay: -.24s; }
    .sp i:nth-child(4) { transform: rotate(135deg); animation-delay: -.36s; }
    .sp i:nth-child(5) { transform: rotate(180deg); animation-delay: -.48s; }
    .sp i:nth-child(6) { transform: rotate(225deg); animation-delay: -.6s; }
    .sp i:nth-child(7) { transform: rotate(270deg); animation-delay: -.72s; }
    .sp i:nth-child(8) { transform: rotate(315deg); animation-delay: -.84s; }
    @keyframes tick { 0%,15% { opacity: 1; } 40%,100% { opacity: .15; } }
    .note { margin-top: 28px; color: #737373; font-size: 12px; line-height: 1.55; max-width: 46ch; }
  </style>
</head>
<body>
  <div class="stage">
    <p class="label">09 · CLOCK TICKS</p>
    <div class="think">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a6.5 6.5 0 0 0-4.6 11.1c.4.4.6 1 .6 1.6V17h8v-1.3c0-.6.2-1.2.6-1.6A6.5 6.5 0 0 0 12 3Z"/><path d="M9 21h6"/></svg>
      <span>思考中</span>
    </div>
    <div class="build">Build</div>
    <div class="working">
      <span class="sp" aria-hidden><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span class="working-timer">0:21</span>
      <span class="working-text">响应中...</span>
    </div>
    <p class="note">系统菊花的缩小版。刻度是静态旋转定位，动的是 opacity，Windows 上比整环 rotate 稳。</p>
  </div>
</body>
</html>
