<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>22 · 星座连线</title>
  <style>
    :root {
      --text-stronger: #d9d9d9; --text-muted: #b3b3b3;
      --text-thinking: rgb(115,115,115);
      --surface-messages: oklch(0.141 0.005 285.823);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--surface-messages); color: #e6e7ea;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    .stage { width: min(420px, 88vw); }
    .label { margin: 0 0 18px; color: #808080; font-size: 11px; letter-spacing: 0.04em; }
    .think { display: flex; align-items: center; gap: 8px; min-height: 28px; color: var(--text-thinking); }
    .build { margin: 2px 0 10px 22px; color: var(--text-thinking); }
    .working { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; }
    .working-timer { color: var(--text-stronger); font-variant-numeric: tabular-nums; }
    .working-text { color: var(--text-muted); }
    .sp { width: 14px; height: 14px; display: block; }
    .sp circle { fill: var(--text-stronger); }
    .sp line {
      stroke: var(--text-stronger); stroke-width: 1.15; stroke-linecap: round;
      stroke-dasharray: 12; stroke-dashoffset: 12;
      animation: draw 1.8s ease-in-out infinite;
    }
    .sp .l2 { animation-delay: 0.35s; }
    .sp .star { animation: twinkle 1.8s ease-in-out infinite; }
    .sp .s2 { animation-delay: 0.2s; }
    .sp .s3 { animation-delay: 0.4s; }
    @keyframes draw {
      0%, 12% { stroke-dashoffset: 12; }
      35%, 62% { stroke-dashoffset: 0; }
      82%, 100% { stroke-dashoffset: 12; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.35; }
      40% { opacity: 1; }
    }
    .note { margin-top: 28px; color: #737373; font-size: 12px; line-height: 1.55; max-width: 46ch; }
  </style>
</head>
<body>
  <div class="stage">
    <p class="label">22 · CONSTELLATION</p>
    <div class="think">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a6.5 6.5 0 0 0-4.6 11.1c.4.4.6 1 .6 1.6V17h8v-1.3c0-.6.2-1.2.6-1.6A6.5 6.5 0 0 0 12 3Z"/><path d="M9 21h6"/></svg>
      <span>思考中</span>
    </div>
    <div class="build">Build</div>
    <div class="working">
      <svg class="sp" viewBox="0 0 14 14" aria-hidden>
      <line class="l1" x1="2.2" y1="11" x2="7" y2="2.4"/>
      <line class="l2" x1="7" y1="2.4" x2="12" y2="10.2"/>
      <circle class="star s1" cx="2.2" cy="11" r="1.15"/>
      <circle class="star s2" cx="7" cy="2.4" r="1.15"/>
      <circle class="star s3" cx="12" cy="10.2" r="1.15"/>
    </svg>
      <span class="working-timer">0:21</span>
      <span class="working-text">响应中...</span>
    </div>
    <p class="note">三点连成星座，线画上再收回。叙事感强。dash + opacity，Win 比 rotate 环稳。</p>
  </div>
  
</body>
</html>
