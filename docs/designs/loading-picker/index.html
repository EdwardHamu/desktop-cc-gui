<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>响应中 Loading · 25 选 1</title>
  <style>
    :root {
      --text-primary: #e6e7ea;
      --text-stronger: #d9d9d9;
      --text-muted: #b3b3b3;
      --text-faint: #808080;
      --text-fainter: #737373;
      --text-thinking: rgb(115, 115, 115);
      --surface-messages: oklch(0.141 0.005 285.823);
      --surface-card: oklch(0.21 0.006 285.885);
      --surface-item: oklch(0.195 0.006 286);
      --border-subtle: oklch(0.245 0.005 286);
      --border-strong: oklch(0.32 0.006 286);
      --status-warning: #ffaf55;
      --status-success: #78ebbe;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      --mono: "SF Mono", Menlo, Monaco, "Microsoft YaHei Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--surface-messages);
      color: var(--text-primary);
      font-family: var(--font);
    }

    /* 选款页强制播放，避免本机 reduce-motion 让整页看起来全是死圈 */
    .force-motion, .force-motion * {
      animation-play-state: running !important;
    }

    body { padding: 28px 32px 96px; }

    header {
      max-width: 1180px;
      margin: 0 auto 22px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 620;
      letter-spacing: -0.02em;
    }
    .lede {
      margin: 0;
      max-width: 76ch;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .diag, .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .pill, .filter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--surface-item);
      color: var(--text-faint);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .pill.bad { color: var(--status-warning); border-color: color-mix(in srgb, var(--status-warning) 35%, transparent); }
    .pill.ok { color: var(--status-success); border-color: color-mix(in srgb, var(--status-success) 35%, transparent); }
    .filter { cursor: pointer; font: inherit; }
    .filter.is-on {
      color: var(--text-primary);
      border-color: color-mix(in srgb, var(--status-success) 45%, var(--border-strong));
    }

    .grid {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

    .card {
      position: relative;
      padding: 14px 16px 16px;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      background: var(--surface-card);
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
    }
    .card:hover { border-color: var(--border-strong); }
    .card.is-selected {
      border-color: color-mix(in srgb, var(--status-success) 55%, var(--border-strong));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--status-success) 35%, transparent);
    }
    .card.is-hidden { display: none; }
    .card-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
    }
    .card-id {
      color: var(--text-fainter);
      font-family: var(--mono);
      font-size: 10px;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 12px; }
    .tag {
      font-size: 10px;
      color: var(--text-faint);
      letter-spacing: 0.02em;
    }

    .preview {
      padding: 10px 12px 8px;
      border-radius: 8px;
      background: var(--surface-messages);
    }
    .think {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
      color: var(--text-thinking);
      font-size: 13px;
    }
    .think svg { flex: 0 0 14px; }
    .build {
      margin: 2px 0 8px 22px;
      color: var(--text-thinking);
      font-size: 13px;
    }
    .working {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-fainter);
      font-size: 12px;
      letter-spacing: 0.02em;
    }
    .working-timer { color: var(--text-stronger); font-variant-numeric: tabular-nums; }
    .working-text { color: var(--text-muted); }

    /* 1 现状空心环 */
    .sp-ring {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: var(--text-stronger);
      animation: spin 1s linear infinite;
    }

    /* 2 高对比缺口环 */
    .sp-arc {
      width: 14px; height: 14px;
      border-radius: 50%;
      background:
        conic-gradient(from 0deg, var(--text-stronger) 0 72deg, rgba(255,255,255,0.12) 72deg 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
      animation: spin 0.8s linear infinite;
    }

    /* 3 SVG dash */
    .sp-dash { width: 14px; height: 14px; display: block; }
    .sp-dash circle {
      fill: none;
      stroke: var(--text-stronger);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 18 22;
      transform-origin: 7px 7px;
      animation: dash 0.9s linear infinite;
    }

    /* 4 三连点 */
    .sp-dots { display: inline-flex; align-items: center; gap: 3px; width: 16px; height: 14px; }
    .sp-dots i {
      width: 3.5px; height: 3.5px; border-radius: 50%;
      background: var(--text-stronger);
      animation: blink 1s ease-in-out infinite;
    }
    .sp-dots i:nth-child(2) { animation-delay: 0.15s; }
    .sp-dots i:nth-child(3) { animation-delay: 0.3s; }

    /* 5 细条 */
    .sp-bar {
      width: 28px; height: 3px;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
    }
    .sp-bar span {
      display: block; width: 40%; height: 100%;
      border-radius: inherit;
      background: var(--text-stronger);
      animation: bar 1.05s ease-in-out infinite;
    }

    /* 6 呼吸点 */
    .sp-breath {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-stronger);
      animation: breath 1.1s ease-in-out infinite;
    }

    /* 7 双弧 */
    .sp-dual {
      width: 14px; height: 14px; position: relative;
    }
    .sp-dual::before, .sp-dual::after {
      content: "";
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      animation: spin 0.85s linear infinite;
    }
    .sp-dual::before { border-top-color: var(--text-stronger); }
    .sp-dual::after {
      border-bottom-color: rgba(255,255,255,0.35);
      animation-duration: 1.25s;
      animation-direction: reverse;
    }

    /* 8 轨道微粒 */
    .sp-orbit {
      width: 14px; height: 14px; position: relative;
      animation: spin 1.1s linear infinite;
    }
    .sp-orbit i {
      position: absolute; left: 50%; top: 0;
      width: 3px; height: 3px; margin-left: -1.5px;
      border-radius: 50%; background: var(--text-stronger);
    }
    .sp-orbit i:nth-child(2) { top: auto; bottom: 1px; opacity: 0.55; }
    .sp-orbit i:nth-child(3) { top: 50%; left: 0; margin: -1.5px 0 0; opacity: 0.3; }

    /* 9 八段时钟 */
    .sp-ticks { width: 14px; height: 14px; position: relative; }
    .sp-ticks i {
      position: absolute; left: 6.25px; top: 0;
      width: 1.5px; height: 4px;
      border-radius: 1px;
      background: var(--text-stronger);
      transform-origin: 50% 7px;
      animation: tick 0.96s linear infinite;
    }
    .sp-ticks i:nth-child(1) { transform: rotate(0deg); animation-delay: 0s; }
    .sp-ticks i:nth-child(2) { transform: rotate(45deg); animation-delay: -0.12s; }
    .sp-ticks i:nth-child(3) { transform: rotate(90deg); animation-delay: -0.24s; }
    .sp-ticks i:nth-child(4) { transform: rotate(135deg); animation-delay: -0.36s; }
    .sp-ticks i:nth-child(5) { transform: rotate(180deg); animation-delay: -0.48s; }
    .sp-ticks i:nth-child(6) { transform: rotate(225deg); animation-delay: -0.6s; }
    .sp-ticks i:nth-child(7) { transform: rotate(270deg); animation-delay: -0.72s; }
    .sp-ticks i:nth-child(8) { transform: rotate(315deg); animation-delay: -0.84s; }

    /* 10 字符帧 */
    .sp-glyph {
      width: 14px; height: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-stronger);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1;
    }

    /* 11 心电图 */
    .sp-ecg { width: 22px; height: 14px; display: block; }
    .sp-ecg path {
      fill: none; stroke: var(--text-stronger); stroke-width: 1.35;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .sp-ecg .ghost { opacity: 0.22; }
    .sp-ecg .chase {
      stroke-dasharray: 10 28;
      animation: ecg 1.05s linear infinite;
    }

    /* 12 沙漏 */
    .sp-glass { width: 14px; height: 14px; display: block; }
    .sp-glass .frame { fill: none; stroke: var(--text-stronger); stroke-width: 1.25; }
    .sp-glass .sand-top {
      fill: var(--text-stronger);
      transform-origin: 7px 2.4px;
      animation: drain 1.8s ease-in-out infinite;
    }
    .sp-glass .sand-bot {
      fill: var(--text-stronger);
      transform-origin: 7px 12.2px;
      animation: fill 1.8s ease-in-out infinite;
    }
    .sp-glass .stream {
      fill: var(--text-stronger);
      animation: drip 1.8s linear infinite;
    }

    /* 13 月相 */
    .sp-moon {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--text-stronger);
      position: relative; overflow: hidden;
    }
    .sp-moon i {
      position: absolute; inset: -1px;
      border-radius: 50%;
      background: var(--surface-messages);
      animation: phase 2.6s ease-in-out infinite;
    }

    /* 14 雷达 */
    .sp-radar {
      width: 14px; height: 14px; border-radius: 50%;
      position: relative;
      background:
        radial-gradient(circle at 50% 50%, transparent 58%, rgba(255,255,255,0.22) 59% 61%, transparent 62%),
        conic-gradient(from 0deg, var(--text-stronger), transparent 80deg);
      animation: spin 1.25s linear infinite;
    }
    .sp-radar::after {
      content: "";
      position: absolute; left: 50%; top: 50%;
      width: 2px; height: 2px; margin: -1px 0 0 -1px;
      border-radius: 50%; background: var(--text-stronger);
    }

    /* 15 莫尔斯 */
    .sp-morse {
      width: 14px; height: 3px; border-radius: 2px;
      background: var(--text-stronger);
      transform-origin: left center;
      animation: morse 1.7s steps(1, end) infinite;
    }

    /* 16 无穷 */
    .sp-inf { width: 18px; height: 14px; display: block; }
    .sp-inf path {
      fill: none; stroke: var(--text-stronger); stroke-width: 1.5;
      stroke-linecap: round;
    }
    .sp-inf .ghost { opacity: 0.22; }
    .sp-inf .chase {
      stroke-dasharray: 10 36;
      animation: inf 1.15s linear infinite;
    }

    /* 17 涟漪 */
    .sp-ripple { width: 14px; height: 14px; position: relative; }
    .sp-ripple i {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1.3px solid var(--text-stronger);
      animation: ripple 1.45s ease-out infinite;
    }
    .sp-ripple i:nth-child(2) { animation-delay: 0.72s; }

    /* 18 钟摆 */
    .sp-pend { width: 14px; height: 14px; position: relative; }
    .sp-pend i {
      position: absolute; left: 6.15px; top: 0.4px;
      width: 1.7px; height: 12px;
      background: var(--text-stronger);
      border-radius: 1px 1px 8px 8px;
      transform-origin: 50% 0;
      animation: pend 0.92s ease-in-out infinite alternate;
    }

    /* 19 光标 */
    .sp-caret {
      width: 6px; height: 12px;
      background: var(--text-stronger);
      animation: caret 1.05s steps(1, end) infinite;
    }

    /* 20 像素阵 */
    .sp-pix {
      width: 14px; height: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5px;
    }
    .sp-pix i {
      background: var(--text-stronger);
      animation: pix 1.2s ease-in-out infinite;
    }
    .sp-pix i:nth-child(1) { animation-delay: 0s; }
    .sp-pix i:nth-child(2) { animation-delay: 0.1s; }
    .sp-pix i:nth-child(3) { animation-delay: 0.2s; }
    .sp-pix i:nth-child(4) { animation-delay: 0.15s; }
    .sp-pix i:nth-child(5) { animation-delay: 0.35s; }
    .sp-pix i:nth-child(6) { animation-delay: 0.05s; }
    .sp-pix i:nth-child(7) { animation-delay: 0.25s; }
    .sp-pix i:nth-child(8) { animation-delay: 0.4s; }
    .sp-pix i:nth-child(9) { animation-delay: 0.18s; }

    /* 21 方轨蠕虫 */
    .sp-worm { width: 14px; height: 14px; display: block; }
    .sp-worm rect {
      fill: none; stroke: var(--text-stronger); stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 7 29;
      animation: crawl 0.95s linear infinite;
    }

    /* 22 星座 */
    .sp-stars { width: 14px; height: 14px; display: block; }
    .sp-stars circle { fill: var(--text-stronger); }
    .sp-stars line {
      stroke: var(--text-stronger); stroke-width: 1.15; stroke-linecap: round;
      stroke-dasharray: 12; stroke-dashoffset: 12;
      animation: draw 1.8s ease-in-out infinite;
    }
    .sp-stars .l2 { animation-delay: 0.35s; }
    .sp-stars .star { animation: twinkle 1.8s ease-in-out infinite; }
    .sp-stars .s2 { animation-delay: 0.2s; }
    .sp-stars .s3 { animation-delay: 0.4s; }

    /* 23 火苗 */
    .sp-flame { width: 10px; height: 14px; position: relative; }
    .sp-flame i {
      position: absolute; left: 50%; bottom: 0.4px;
      width: 6px; height: 11px; margin-left: -3px;
      background: var(--text-stronger);
      border-radius: 50% 50% 46% 46% / 68% 68% 32% 32%;
      animation: flame 0.52s ease-in-out infinite alternate;
    }
    .sp-flame i:last-child {
      width: 3.2px; height: 6px; margin-left: -1.6px; bottom: 1px;
      opacity: 0.4; animation-duration: 0.38s; animation-delay: -0.1s;
    }

    /* 24 二进制 */
    .sp-bit {
      width: 14px; height: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-stronger);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1;
    }

    /* 25 一笔墨 */
    .sp-ink { width: 14px; height: 14px; display: block; }
    .sp-ink path {
      fill: none; stroke: var(--text-stronger); stroke-width: 1.7;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .sp-ink .ghost { opacity: 0.18; }
    .sp-ink .chase {
      stroke-dasharray: 22;
      stroke-dashoffset: 22;
      animation: ink 1.6s ease-in-out infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes dash { to { stroke-dashoffset: -40; } }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }
    @keyframes bar {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(280%); }
    }
    @keyframes breath {
      0%, 100% { opacity: 0.35; transform: scale(0.75); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes tick {
      0%, 15% { opacity: 1; }
      40%, 100% { opacity: 0.15; }
    }
    @keyframes ecg { to { stroke-dashoffset: -38; } }
    @keyframes drain {
      0% { transform: scaleY(1); }
      70%, 100% { transform: scaleY(0.12); }
    }
    @keyframes fill {
      0% { transform: scaleY(0.15); }
      70%, 100% { transform: scaleY(1); }
    }
    @keyframes drip {
      0%, 8% { opacity: 0; }
      12%, 68% { opacity: 1; }
      78%, 100% { opacity: 0; }
    }
    @keyframes phase {
      0% { transform: translateX(-110%); }
      50% { transform: translateX(0); }
      100% { transform: translateX(110%); }
    }
    @keyframes morse {
      0%, 14% { transform: scaleX(1); opacity: 1; }
      18%, 22% { opacity: 0; }
      24%, 32% { transform: scaleX(0.28); opacity: 1; }
      36%, 40% { opacity: 0; }
      42%, 50% { transform: scaleX(0.28); opacity: 1; }
      54%, 100% { transform: scaleX(1); opacity: 0; }
    }
    @keyframes inf { to { stroke-dashoffset: -46; } }
    @keyframes ripple {
      0% { transform: scale(0.18); opacity: 0.95; }
      100% { transform: scale(1); opacity: 0; }
    }
    @keyframes pend {
      from { transform: rotate(-34deg); }
      to { transform: rotate(34deg); }
    }
    @keyframes caret {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pix {
      0%, 100% { opacity: 0.15; }
      40% { opacity: 1; }
    }
    @keyframes crawl { to { stroke-dashoffset: -36; } }
    @keyframes draw {
      0%, 12% { stroke-dashoffset: 12; }
      35%, 62% { stroke-dashoffset: 0; }
      82%, 100% { stroke-dashoffset: 12; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.35; }
      40% { opacity: 1; }
    }
    @keyframes flame {
      from { transform: scaleY(0.84) scaleX(1.12) rotate(-7deg); }
      to { transform: scaleY(1.1) scaleX(0.88) rotate(7deg); }
    }
    @keyframes ink {
      0%, 8% { stroke-dashoffset: 22; opacity: 1; }
      42%, 58% { stroke-dashoffset: 0; opacity: 1; }
      82%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .dock {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      padding: 12px 32px;
      background: color-mix(in srgb, var(--surface-card) 92%, transparent);
      border-top: 1px solid var(--border-subtle);
      backdrop-filter: blur(10px);
      font-size: 12px;
    }
    .dock strong { font-weight: 620; }
    .dock code {
      font-family: var(--mono);
      color: var(--status-success);
    }
  </style>
</head>
<body class="force-motion">
  <header>
    <h1>响应中 · 换一个 loading</h1>
    <p class="lede">
      色值来自 <code>src/styles/themes.dark.css</code>。尺寸对齐现状 14px 行内指示器。
      01–10 是几何族；11–25 换意象（心跳、沙漏、月相、火苗、一笔墨…）。
      生产仍是 Mac <code>03</code> / Win <code>10</code>。回我编号才换实现。
    </p>
    <div class="diag">
      <span class="pill" id="motion-pill">检测 prefers-reduced-motion…</span>
      <span class="pill">生产：Mac 03 SVG 描边 · Win 10 字符帧</span>
      <span class="pill">Win 最常见死因：系统「动画效果」关 → animation:none</span>
    </div>
    <div class="filters" id="filters">
      <button type="button" class="filter is-on" data-filter="all">全部 25</button>
      <button type="button" class="filter" data-filter="geo">几何 01–10</button>
      <button type="button" class="filter" data-filter="image">意象 11–25</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <div class="dock">
    <div>已选：<strong id="picked">还没选</strong>　<code id="picked-id">—</code></div>
    <div>点卡片选中，回我编号（01–25）</div>
  </div>

  <script>
    const FRAMES = ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"];
    const items = [
      { id: "01", file: "01-current-ring.html", name: "现状空心环", family: "geo",
        win: "几何 · Win 弱 · rotate 空心环会被掐死",
        html: '<span class="sp-ring" aria-hidden></span>' },
      { id: "02", file: "02-contrast-arc.html", name: "高对比缺口环", family: "geo",
        win: "几何 · 仍靠 rotate，Win 同病",
        html: '<span class="sp-arc" aria-hidden></span>' },
      { id: "03", file: "03-svg-dash.html", name: "SVG 描边追逐", family: "geo",
        win: "几何 · 生产 Mac · dashoffset，Win 比 rotate 稳",
        html: '<svg class="sp-dash" viewBox="0 0 14 14" aria-hidden><circle cx="7" cy="7" r="5.2"/></svg>' },
      { id: "04", file: "04-three-dots.html", name: "三连点", family: "geo",
        win: "几何 · 只改 opacity，合成层友好",
        html: '<span class="sp-dots" aria-hidden><i></i><i></i><i></i></span>' },
      { id: "05", file: "05-indeterminate-bar.html", name: "细进度条", family: "geo",
        win: "几何 · translateX，Win 上见过能动",
        html: '<span class="sp-bar" aria-hidden><span></span></span>' },

    ];

    const grid = document.getElementById("grid");
    items.forEach((item) => {
      const btn = document.createElement("button");
      btn.className = "card";
      btn.type = "button";
      btn.dataset.id = item.id;
      btn.dataset.family = item.family;
      btn.innerHTML = `
        <div class="card-meta">
          <div class="card-title">${item.id} · ${item.name}</div>
          <div class="card-id">${item.file}</div>
        </div>
        <div class="tags"><span class="tag">${item.win}</span></div>
        <div class="preview">
          <div class="think">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a6.5 6.5 0 0 0-4.6 11.1c.4.4.6 1 .6 1.6V17h8v-1.3c0-.6.2-1.2.6-1.6A6.5 6.5 0 0 0 12 3Z"/><path d="M9 21h6"/></svg>
            <span>思考中</span>
          </div>
          <div class="build">Build</div>
          <div class="working">
            ${item.html}
            <span class="working-timer">0:21</span>
            <span class="working-text">响应中...</span>
          </div>
        </div>`;
      btn.addEventListener("click", () => pick(item, btn));
      grid.appendChild(btn);
    });

    function pick(item, btn) {
      document.querySelectorAll(".card").forEach((el) => el.classList.remove("is-selected"));
      btn.classList.add("is-selected");
      document.getElementById("picked").textContent = item.id + " · " + item.name;
      document.getElementById("picked-id").textContent = item.file;
      history.replaceState(null, "", "#" + item.id);
    }

    document.getElementById("filters").addEventListener("click", (event) => {
      const chip = event.target.closest("[data-filter]");
      if (!chip) return;
      const filter = chip.dataset.filter;
      document.querySelectorAll(".filter").forEach((el) => el.classList.toggle("is-on", el === chip));
      document.querySelectorAll(".card").forEach((card) => {
        const show = filter === "all" || card.dataset.family === filter;
        card.classList.toggle("is-hidden", !show);
      });
    });

    const glyphs = document.querySelectorAll("[data-glyph]");
    let frame = 0;
    setInterval(() => {
      frame = (frame + 1) % FRAMES.length;
      glyphs.forEach((el) => { el.textContent = FRAMES[frame]; });
    }, 80);

    const bits = document.querySelectorAll("[data-bit]");
    setInterval(() => {
      bits.forEach((el) => { el.textContent = el.textContent === "0" ? "1" : "0"; });
    }, 160);

    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    const pill = document.getElementById("motion-pill");
    function paintMotion() {
      if (reduce.matches) {
        pill.className = "pill bad";
        pill.textContent = "本机 prefers-reduced-motion: reduce → 生产现状圈会被 CSS 直接停掉";
      } else {
        pill.className = "pill ok";
        pill.textContent = "本机 prefers-reduced-motion: no-preference（Win 出问题多半是那边开了「减少动画」）";
      }
    }
    paintMotion();
    reduce.addEventListener("change", paintMotion);

    const hash = location.hash.replace("#", "");
    const preset = items.find((item) => item.id === hash);
    if (preset) {
      const btn = document.querySelector(`[data-id="${preset.id}"]`);
      if (btn) pick(preset, btn);
    }
  </script>
