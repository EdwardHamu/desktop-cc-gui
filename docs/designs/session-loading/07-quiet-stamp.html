<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>07 · Quiet Stamp · Session Loading</title>
  <link rel="stylesheet" href="tokens.css" />
  <script src="embed.js"></script>
  <style>
    .line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-fainter);
      font-size: 13px;
    }
    .caret {
      width: 6px;
      height: 13px;
      background: var(--text-muted);
      animation: blink 1.05s steps(1) infinite;
    }
    .shared .caret { background: var(--status-success); }
    .meta {
      margin-top: 8px;
      padding-left: 30px;
      color: var(--text-dim);
      font-size: 11px;
      font-family: var(--mono);
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }
  </style>
</head>
<body class="force-motion">
  <div class="page">
    <a class="back" href="index.html">← Session Loading 选款</a>
    <header class="page-head">
      <p class="page-kicker">07 · Terminal quiet</p>
      <h1>Quiet Stamp</h1>
      <p>画布几乎空。一行字 + 极小 logo + 闪烁 caret。像编辑器在读盘，不像产品在表演 loading。Shared 把百分数写成等宽后缀，不另开进度条。</p>
    </header>
    <div class="pair">
      <section class="pane">
        <div class="pane-meta">
          <strong>Native · Claude Code</strong>
          <span class="badge native">One line</span>
        </div>
        <div class="canvas">
          <div>
            <div class="line">
              <img class="logo xs" src="assets/app-icon.png" alt="" />
              <span>正在加载对话窗口</span>
              <i class="caret" aria-hidden="true"></i>
            </div>
          </div>
        </div>
      </section>
      <section class="pane shared">
        <div class="pane-meta">
          <strong>Shared</strong>
          <span class="badge shared">One line · 42%</span>
        </div>
        <div class="canvas">
          <div>
            <div class="line">
              <img class="logo xs" src="assets/app-icon.png" alt="" />
              <span>正在恢复 Shared 会话</span>
              <i class="caret" aria-hidden="true"></i>
            </div>
            <div class="meta">projection · 42%</div>
          </div>
        </div>
      </section>
    </div>
    <p class="note">给「空画布 10 秒」这种事故留最少视觉债：用户知道在加载，但不会觉得系统在演戏。风险：第一次用的人可能以为坏了。</p>
  </div>
</body>
</html>
