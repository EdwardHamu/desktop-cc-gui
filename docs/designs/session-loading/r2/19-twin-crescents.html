<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>19 · Twin Crescents · Session Loading</title>
  <link rel="stylesheet" href="../tokens.css" />
  <script src="../embed.js"></script>
  <style>
    .mark { display: grid; place-items: center; gap: 22px; }
    .orbit {
      position: relative;
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
    }
    .orbit::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px dashed color-mix(in srgb, var(--text-fainter) 28%, transparent);
    }
    .crescent {
      position: absolute;
      left: 50%;
      top: 2px;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset -3px 0 0 0 var(--surface-messages), 0 0 10px rgba(255,255,255,0.25);
      transform-origin: 50% 54px;
    }
    .native .a { animation: spin 2.2s linear infinite; }
    .native .b { animation: spin 2.2s linear infinite reverse; }
    .shared .a {
      background: var(--status-success);
      box-shadow: inset -3px 0 0 0 var(--surface-messages), 0 0 10px color-mix(in srgb, var(--status-success) 40%, transparent);
      transform: rotate(151deg);
    }
    .shared .b { transform: rotate(331deg); }
    .trail {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: conic-gradient(var(--status-success) 0 42%, transparent 42% 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 1.5px), #000 calc(100% - 1.5px));
      transform: rotate(-90deg);
      opacity: 0.85;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="force-motion">
  <div class="page">
    <a class="back" href="index.html">← Round 2</a>
    <header class="page-head">
      <p class="page-kicker">19 · Product DNA</p>
      <h1>Twin Crescents</h1>
      <p>03 是一颗圆点绕 logo。这里改成两弯新月对舞——logo 里本来就有两弯月。Native 正反公转；Shared 锁在 42% / 222°，并留下确定弧。</p>
    </header>
    <div class="pair">
      <section class="pane native">
        <div class="pane-meta">
          <strong>Native · DSH</strong>
          <span class="badge native">Counter-orbit</span>
        </div>
        <div class="canvas">
          <div class="mark">
            <div class="orbit">
              <i class="crescent a" aria-hidden="true"></i>
              <i class="crescent b" aria-hidden="true"></i>
              <img class="logo" src="../assets/app-icon.png" alt="mossx" />
            </div>
            <div class="copy">
              <strong>正在加载对话窗口…</strong>
              <em>正在加载本地 transcript 和会话状态。</em>
            </div>
          </div>
        </div>
      </section>
      <section class="pane shared">
        <div class="pane-meta">
          <strong>Shared</strong>
          <span class="badge shared">Locked pair</span>
        </div>
        <div class="canvas">
          <div class="mark">
            <div class="orbit">
              <span class="trail" aria-hidden="true"></span>
              <i class="crescent a" aria-hidden="true"></i>
              <i class="crescent b" aria-hidden="true"></i>
              <img class="logo" src="../assets/app-icon.png" alt="mossx" />
            </div>
            <div class="copy">
              <strong>正在恢复 Shared 会话…</strong>
              <em>投影 · 42%</em>
            </div>
          </div>
        </div>
      </section>
    </div>
    <p class="note">和 03 同属圆轨家族，但粒子从「通用圆点」换成「产品自己的两弯月」。若选 03，这个是它的品牌加强版。</p>
  </div>
</body>
</html>
