<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>18 · Sweep · Session Loading</title>
  <link rel="stylesheet" href="../tokens.css" />
  <script src="../embed.js"></script>
  <style>
    .canvas {
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
    }
    .field {
      position: relative;
      flex: 1;
      min-height: 360px;
      overflow: hidden;
    }
    .plane {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--text-strong);
    }
    .native .plane {
      left: 8%;
      animation: cross 2s ease-in-out infinite;
      box-shadow: 0 0 36px 8px color-mix(in srgb, var(--text-accent) 70%, transparent);
    }
    .shared .plane {
      left: 42%;
      background: var(--status-success);
      box-shadow: 0 0 36px 8px color-mix(in srgb, var(--status-success) 70%, transparent);
    }
    .wake {
      position: absolute;
      inset: 0 auto 0 0;
      width: 42%;
      background: linear-gradient(90deg, color-mix(in srgb, var(--status-success) 16%, transparent), transparent);
    }
    .stamp {
      position: absolute;
      top: 50%;
      left: 8%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px 8px 8px;
      border-radius: 12px;
      background: var(--surface-card);
      border: 1px solid var(--border-strong);
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
      transform: translate(10px, -50%);
    }
    .native .stamp { animation: ride 2s ease-in-out infinite; }
    .shared .stamp { left: 42%; }
    .stamp strong {
      color: var(--text-stronger);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .stamp em {
      display: block;
      color: var(--text-fainter);
      font-size: 11px;
      font-style: normal;
    }
    @keyframes cross {
      0% { left: 8%; }
      50% { left: 88%; }
      100% { left: 8%; }
    }
    @keyframes ride {
      0% { left: 8%; }
      50% { left: 88%; }
      100% { left: 8%; }
    }
  </style>
</head>
<body class="force-motion">
  <div class="page">
    <a class="back" href="index.html">← Round 2</a>
    <header class="page-head">
      <p class="page-kicker">18 · Cinematic plane</p>
      <h1>Sweep</h1>
      <p>一条竖光切开整块画布。logo 钉在光边上跟着走。Native 来回扫；Shared 停在 42%，身后留一层淡绿余晖。</p>
    </header>
    <div class="pair">
      <section class="pane native">
        <div class="pane-meta">
          <strong>Native · DSH</strong>
          <span class="badge native">Scanning</span>
        </div>
        <div class="canvas">
          <div class="field">
            <span class="plane" aria-hidden="true"></span>
            <div class="stamp">
              <img class="logo xs" src="../assets/app-icon.png" alt="mossx" />
              <div>
                <strong>正在加载对话窗口…</strong>
                <em>本地 transcript</em>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="pane shared">
        <div class="pane-meta">
          <strong>Shared</strong>
          <span class="badge shared">Parked 42%</span>
        </div>
        <div class="canvas">
          <div class="field">
            <span class="wake" aria-hidden="true"></span>
            <span class="plane" aria-hidden="true"></span>
            <div class="stamp">
              <img class="logo xs" src="../assets/app-icon.png" alt="mossx" />
              <div>
                <strong>正在恢复 Shared 会话…</strong>
                <em>投影 · 42%</em>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <p class="note">占用整块 pane，和居中控件彻底分家。风险：扫光会抢滚动注意力，落地时 sweep 周期不要短于 2s。</p>
  </div>
</body>
</html>
