<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Session Loading · Round 2</title>
  <style>
    :root {
      --text-primary: #e6e7ea;
      --text-stronger: #d9d9d9;
      --text-muted: #b3b3b3;
      --text-faint: #808080;
      --text-fainter: #737373;
      --text-accent: #7a9dcc;
      --surface-messages: oklch(0.141 0.005 285.823);
      --surface-card: oklch(0.21 0.006 285.885);
      --surface-item: oklch(0.195 0.006 286);
      --border-subtle: oklch(0.245 0.005 286);
      --status-success: #78ebbe;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      --mono: "SF Mono", Menlo, Monaco, "Microsoft YaHei Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--surface-messages);
      color: var(--text-primary);
      font-family: var(--font);
    }
    body { padding: 28px 32px 96px; }
    header { max-width: 1180px; margin: 0 auto 22px; }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .brand img { width: 28px; height: 28px; border-radius: 8px; }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 620;
      letter-spacing: -0.02em;
    }
    .lede {
      margin: 0;
      max-width: 82ch;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .kept {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .kept a, .filter {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--surface-item);
      color: var(--text-faint);
      font: inherit;
      font-size: 11px;
      text-decoration: none;
      cursor: pointer;
    }
    .kept a { color: var(--status-success); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .filter.is-on {
      color: var(--text-primary);
      border-color: color-mix(in srgb, var(--status-success) 45%, transparent);
    }
    .grid {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .card {
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      background: var(--surface-card);
      overflow: hidden;
    }
    .card.is-hidden { display: none; }
    .card-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px 10px;
    }
    .card-title { font-size: 14px; font-weight: 600; }
    .card-id { color: var(--text-fainter); font-family: var(--mono); font-size: 11px; }
    .tags {
      padding: 0 16px 10px;
      color: var(--text-faint);
      font-size: 11px;
    }
    iframe {
      display: block;
      width: 100%;
      height: 520px;
      border: 0;
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-messages);
    }
    .open {
      display: inline-block;
      padding: 0 16px 14px;
      color: var(--text-accent);
      font-size: 12px;
      text-decoration: none;
    }
    .open:hover { color: var(--text-primary); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="../assets/app-icon.png" alt="mossx" />
      <span style="color:#808080;font-size:12px;letter-spacing:0.08em;">MOSSX · ROUND 2</span>
    </div>
    <h1>第二轮 · 几何差开的 10 个</h1>
    <p class="lede">
      你留了 03 轨道、04 相位轨、10 双身份。这一轮不再围着「居中 logo + 条」打转，
      每个方案换一种空间：日食、底栏、竖脊、握手、地平线、仪表、星座、扫光、双月、大字。
      Native 仍禁假相位；Shared 仍报真进度。
    </p>
    <div class="kept">
      <a href="../03-orbit-halo.html">保留 03 Orbit</a>
      <a href="../04-phase-rail.html">保留 04 Rail</a>
      <a href="../10-identity-split.html">保留 10 Identity</a>
      <a href="../index.html">回第一轮</a>
    </div>
    <div class="filters">
      <button class="filter is-on" data-tag="all">全部</button>
      <button class="filter" data-tag="motion">运动签名</button>
      <button class="filter" data-tag="space">换空间</button>
      <button class="filter" data-tag="identity">身份</button>
      <button class="filter" data-tag="info">信息</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <script>
    const ITEMS = [
      { id: "11", file: "11-eclipse.html", title: "Eclipse", tags: ["motion"], blurb: "logo 自己被食，不再另画 spinner" },
      { id: "12", file: "12-statusline.html", title: "Statusline", tags: ["space", "info"], blurb: "画布空，加载沉到底栏" },
      { id: "13", file: "13-spine.html", title: "Spine", tags: ["space", "info"], blurb: "左脊爬光 / 四颗真相位点" },
      { id: "14", file: "14-handshake.html", title: "Handshake", tags: ["identity", "motion"], blurb: "10 的双标改成隔桥相望" },
      { id: "15", file: "15-horizon.html", title: "Horizon", tags: ["space", "motion"], blurb: "logo 坐在潮汐地平线上" },
      { id: "16", file: "16-dial.html", title: "Dial", tags: ["info"], blurb: "仪表盘，指针找或钉在 42%" },
      { id: "17", file: "17-constellation.html", title: "Constellation", tags: ["space"], blurb: "星点，不是气泡骨架" },
      { id: "18", file: "18-sweep.html", title: "Sweep", tags: ["space", "motion"], blurb: "竖光切开整块画布" },
      { id: "19", file: "19-twin-crescents.html", title: "Twin Crescents", tags: ["motion", "identity"], blurb: "03 的圆点换成产品自己的两弯月" },
      { id: "20", file: "20-giant-type.html", title: "Giant Type", tags: ["info"], blurb: "进度变成 92px 的主角" },
    ];
    const grid = document.getElementById("grid");
    grid.innerHTML = ITEMS.map((item) => `
      <article class="card" data-tags="${item.tags.join(" ")}">
        <div class="card-meta">
          <div class="card-title">${item.title}</div>
          <div class="card-id">${item.id}</div>
        </div>
        <div class="tags">${item.blurb}</div>
        <iframe src="${item.file}" title="${item.title}" loading="lazy"></iframe>
        <a class="open" href="${item.file}">打开单页 →</a>
      </article>
    `).join("");

    const filters = document.querySelectorAll(".filter");
    filters.forEach((btn) => {
      btn.addEventListener("click", () => {
        filters.forEach((b) => b.classList.toggle("is-on", b === btn));
        const tag = btn.dataset.tag;
        document.querySelectorAll(".card").forEach((card) => {
          card.classList.toggle(
            "is-hidden",
            tag !== "all" && !card.dataset.tags.includes(tag)
          );
        });
      });
    });
  </script>
</body>
</html>
