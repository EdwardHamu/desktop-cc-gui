<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>11 · Eclipse · Session Loading</title>
  <link rel="stylesheet" href="../tokens.css" />
  <script src="../embed.js"></script>
  <style>
    .stage { display: grid; justify-items: center; gap: 22px; }
    .eclipse {
      position: relative;
      width: 88px;
      height: 88px;
    }
    .eclipse img {
      width: 88px;
      height: 88px;
      border-radius: 22px;
    }
    .shade {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      background: var(--surface-messages);
      mix-blend-mode: multiply;
      opacity: 0.72;
      pointer-events: none;
    }
    .native .shade {
      animation: eclipse-pass 2.4s ease-in-out infinite;
    }
    .shared .shade {
      clip-path: inset(0 58% 0 0);
    }
    .tick {
      position: absolute;
      inset: -10px;
      border-radius: 28px;
      border: 1px solid color-mix(in srgb, var(--text-fainter) 28%, transparent);
      pointer-events: none;
    }
    .shared .tick {
      border-color: color-mix(in srgb, var(--status-success) 40%, transparent);
    }
    @keyframes eclipse-pass {
      0% { clip-path: inset(0 100% 0 0); }
      50% { clip-path: inset(0 0 0 0); }
      100% { clip-path: inset(0 0 0 100%); }
    }
  </style>
</head>
<body class="force-motion">
  <div class="page">
    <a class="back" href="index.html">← Round 2</a>
    <header class="page-head">
      <p class="page-kicker">11 · Product metaphor</p>
      <h1>Eclipse</h1>
      <p>双月 logo 自己当进度。Native 是一次完整日食掠过；Shared 停在被挡住 42% 的相位。不另画轨道，不另画条。</p>
    </header>
    <div class="pair">
      <section class="pane native">
        <div class="pane-meta">
          <strong>Native · DSH</strong>
          <span class="badge native">Passing eclipse</span>
        </div>
        <div class="canvas">
          <div class="stage">
            <div class="eclipse">
              <span class="tick" aria-hidden="true"></span>
              <img src="../assets/app-icon.png" alt="mossx" />
              <span class="shade" aria-hidden="true"></span>
            </div>
            <div class="copy">
              <strong>正在加载对话窗口…</strong>
              <em>本地 transcript 正在读入。</em>
            </div>
          </div>
        </div>
      </section>
      <section class="pane shared">
        <div class="pane-meta">
          <strong>Shared</strong>
          <span class="badge shared">42% covered</span>
        </div>
        <div class="canvas">
          <div class="stage">
            <div class="eclipse">
              <span class="tick" aria-hidden="true"></span>
              <img src="../assets/app-icon.png" alt="mossx" />
              <span class="shade" aria-hidden="true"></span>
            </div>
            <div class="copy">
              <strong>正在恢复 Shared 会话…</strong>
              <em>投影 transcript · 42%</em>
            </div>
          </div>
        </div>
      </section>
    </div>
    <p class="note">签名：logo 被食，而不是 logo 旁边再挂一个 spinner。风险：multiply 遮罩在浅色主题要重做。</p>
  </div>
</body>
</html>
