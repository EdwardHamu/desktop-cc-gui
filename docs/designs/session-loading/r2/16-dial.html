<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>16 · Dial · Session Loading</title>
  <link rel="stylesheet" href="../tokens.css" />
  <script src="../embed.js"></script>
  <style>
    .hud { display: grid; justify-items: center; gap: 18px; }
    .dial {
      position: relative;
      width: 168px;
      height: 168px;
    }
    .face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background:
        repeating-conic-gradient(
          from -120deg,
          color-mix(in srgb, var(--text-fainter) 55%, transparent) 0 1deg,
          transparent 1deg 12deg
        );
      -webkit-mask: radial-gradient(farthest-side, transparent 72%, #000 73%);
              mask: radial-gradient(farthest-side, transparent 72%, #000 73%);
    }
    .arc {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: conic-gradient(from -120deg, var(--status-success) 0 100.8deg, transparent 100.8deg);
      -webkit-mask: radial-gradient(farthest-side, transparent 78%, #000 79%);
              mask: radial-gradient(farthest-side, transparent 78%, #000 79%);
    }
    .needle {
      position: absolute;
      left: 50%;
      top: 22px;
      width: 2px;
      height: 58px;
      margin-left: -1px;
      background: var(--text-strong);
      transform-origin: 50% 62px;
      border-radius: 2px;
    }
    .native .needle { animation: hunt 1.7s ease-in-out infinite; }
    .shared .needle { transform: rotate(100.8deg); background: var(--status-success); }
    .hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 36px;
      height: 36px;
      margin: -18px 0 0 -18px;
      border-radius: 10px;
    }
    .readout {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 28px;
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-fainter);
    }
    .shared .readout { color: var(--status-success); }
    .ticks {
      display: flex;
      gap: 14px;
      color: var(--text-dim);
      font-size: 10px;
      letter-spacing: 0.06em;
    }
    .ticks .on { color: var(--text-muted); }
    @keyframes hunt {
      0% { transform: rotate(-40deg); }
      50% { transform: rotate(40deg); }
      100% { transform: rotate(-40deg); }
    }
  </style>
</head>
<body class="force-motion">
  <div class="page">
    <a class="back" href="index.html">← Round 2</a>
    <header class="page-head">
      <p class="page-kicker">16 · Instrument</p>
      <h1>Dial</h1>
      <p>仪表盘。logo 做表芯。Native 指针来回找，没有刻度承诺。Shared 指针钉在 42%，外圈亮出确定弧，相位写在表下。</p>
    </header>
    <div class="pair">
      <section class="pane native">
        <div class="pane-meta">
          <strong>Native · DSH</strong>
          <span class="badge native">Hunting needle</span>
        </div>
        <div class="canvas">
          <div class="hud">
            <div class="dial">
              <span class="face" aria-hidden="true"></span>
              <span class="needle" aria-hidden="true"></span>
              <img class="hub" src="../assets/app-icon.png" alt="mossx" />
              <div class="readout">LOCAL</div>
            </div>
            <div class="copy">
              <strong>正在加载对话窗口…</strong>
              <em>正在加载本地 transcript 和会话状态。</em>
            </div>
          </div>
        </div>
      </section>
      <section class="pane shared">
        <div class="pane-meta">
          <strong>Shared</strong>
          <span class="badge shared">100.8°</span>
        </div>
        <div class="canvas">
          <div class="hud">
            <div class="dial">
              <span class="face" aria-hidden="true"></span>
              <span class="arc" aria-hidden="true"></span>
              <span class="needle" aria-hidden="true"></span>
              <img class="hub" src="../assets/app-icon.png" alt="mossx" />
              <div class="readout">42%</div>
            </div>
            <div class="ticks">
              <span>准备</span>
              <span>快照</span>
              <span class="on">投影</span>
              <span>合并</span>
            </div>
          </div>
        </div>
      </section>
    </div>
    <p class="note">和 03 的圆都是圆，但语言是仪器不是轨道。风险：偏工具感，和对话画布气质可能打架。</p>
  </div>
</body>
</html>
