<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>13 · Spine · Session Loading</title>
  <link rel="stylesheet" href="../tokens.css" />
  <script src="../embed.js"></script>
  <style>
    .canvas { display: block; padding: 0; }
    .frame {
      height: 100%;
      min-height: 360px;
      display: grid;
      grid-template-columns: 56px 1fr;
    }
    .rail {
      position: relative;
      border-right: 1px solid var(--border-subtle);
    }
    .rail::before {
      content: "";
      position: absolute;
      left: 27px;
      top: 24px;
      bottom: 24px;
      width: 1px;
      background: color-mix(in srgb, var(--text-fainter) 30%, transparent);
    }
    .logo-pin {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
    }
    .traveler {
      position: absolute;
      left: 25px;
      width: 5px;
      height: 28px;
      border-radius: 99px;
      background: var(--text-accent);
      animation: climb 1.8s ease-in-out infinite;
    }
    .nodes {
      position: absolute;
      left: 23px;
      top: 36px;
      bottom: 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .nodes i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--surface-messages);
      border: 1px solid var(--text-fainter);
    }
    .nodes i.done {
      background: var(--text-stronger);
      border-color: var(--text-stronger);
    }
    .nodes i.now {
      background: var(--status-success);
      border-color: var(--status-success);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--status-success) 18%, transparent);
    }
    .copy-col {
      display: grid;
      align-content: center;
      padding: 0 28px;
      text-align: left;
    }
    .copy-col .copy { text-align: left; }
    .phases {
      margin-top: 16px;
      display: grid;
      gap: 8px;
      color: var(--text-dim);
      font-size: 11px;
      letter-spacing: 0.06em;
    }
    .phases .on { color: var(--text-muted); }
    @keyframes climb {
      0% { top: 28px; }
      50% { top: calc(100% - 56px); }
      100% { top: 28px; }
    }
  </style>
</head>
<body class="force-motion">
  <div class="page">
    <a class="back" href="index.html">← Round 2</a>
    <header class="page-head">
      <p class="page-kicker">13 · Vertical architecture</p>
      <h1>Spine</h1>
      <p>进度改走左脊。Native 一束光上下爬，没有假相位。Shared 在脊上钉四颗真相位点。logo 卡在脊的中点。</p>
    </header>
    <div class="pair">
      <section class="pane">
        <div class="pane-meta">
          <strong>Native · DSH</strong>
          <span class="badge native">Climbing light</span>
        </div>
        <div class="canvas">
          <div class="frame">
            <div class="rail">
              <span class="traveler" aria-hidden="true"></span>
              <img class="logo xs logo-pin" src="../assets/app-icon.png" alt="mossx" />
            </div>
            <div class="copy-col">
              <div class="copy">
                <strong>正在加载对话窗口…</strong>
                <em>正在加载本地 transcript 和会话状态。</em>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="pane">
        <div class="pane-meta">
          <strong>Shared</strong>
          <span class="badge shared">第三点 · 投影</span>
        </div>
        <div class="canvas">
          <div class="frame">
            <div class="rail">
              <div class="nodes" aria-hidden="true">
                <i class="done"></i>
                <i class="done"></i>
                <i class="now"></i>
                <i></i>
              </div>
              <img class="logo xs logo-pin" src="../assets/app-icon.png" alt="mossx" />
            </div>
            <div class="copy-col">
              <div class="copy">
                <strong>正在恢复 Shared 会话…</strong>
                <em>正在拉取 canonical 投影 transcript…</em>
              </div>
              <div class="phases">
                <span>准备</span>
                <span>快照</span>
                <span class="on">投影 · 42%</span>
                <span>合并</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <p class="note">04 的轨是横的、居中的。这个把轨立起来，变成画布结构，不是一块控件。落地时脊不要抢消息滚动条。</p>
  </div>
</body>
</html>
