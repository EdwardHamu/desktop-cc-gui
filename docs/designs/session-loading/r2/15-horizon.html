<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>15 · Horizon · Session Loading</title>
  <link rel="stylesheet" href="../tokens.css" />
  <script src="../embed.js"></script>
  <style>
    .canvas {
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
    }
    .land {
      position: relative;
      flex: 1;
      min-height: 360px;
      overflow: hidden;
      background:
        radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--text-accent) 8%, transparent), transparent 58%),
        var(--surface-messages);
    }
    .sky, .sea {
      position: absolute;
      left: 0;
      right: 0;
    }
    .sky { top: 0; height: 50%; }
    .sea {
      bottom: 0;
      height: 50%;
      border-top: 2px solid color-mix(in srgb, var(--text-muted) 72%, transparent);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--surface-control) 70%, black 30%), var(--surface-item));
      box-shadow: 0 -18px 40px rgba(0,0,0,0.35);
    }
    .native .sea { animation: tide 2.8s ease-in-out infinite; }
    .shared .sea {
      height: 42%;
      border-top-color: color-mix(in srgb, var(--status-success) 85%, white 8%);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--status-success) 18%, var(--surface-control)), var(--surface-item));
    }
    .moon {
      position: absolute;
      left: 50%;
      width: 56px;
      height: 56px;
      margin-left: -28px;
      bottom: calc(50% - 10px);
      z-index: 2;
      box-shadow: 0 10px 28px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08);
    }
    .native .moon { animation: ride 2.8s ease-in-out infinite; }
    .shared .moon { bottom: calc(42% - 10px); }
    .caption {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 22px;
      text-align: left;
      z-index: 3;
    }
    .caption .copy { text-align: left; }
    @keyframes tide {
      0%, 100% { height: 46%; }
      50% { height: 54%; }
    }
    @keyframes ride {
      0%, 100% { bottom: calc(46% - 10px); }
      50% { bottom: calc(54% - 10px); }
    }
  </style>
</head>
<body class="force-motion">
  <div class="page">
    <a class="back" href="index.html">← Round 2</a>
    <header class="page-head">
      <p class="page-kicker">15 · Landscape</p>
      <h1>Horizon</h1>
      <p>整块画布变成地平线。logo 坐在月升线上。Native 潮汐起伏；Shared 海平面停在 42%。这是风景，不是控件。</p>
    </header>
    <div class="pair">
      <section class="pane native">
        <div class="pane-meta">
          <strong>Native · DSH</strong>
          <span class="badge native">Tide</span>
        </div>
        <div class="canvas">
          <div class="land">
            <div class="sky"></div>
            <div class="sea"></div>
            <img class="logo moon" src="../assets/app-icon.png" alt="mossx" />
            <div class="caption">
              <div class="copy">
                <strong>正在加载对话窗口…</strong>
                <em>本地 transcript 正在读入。</em>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="pane shared">
        <div class="pane-meta">
          <strong>Shared</strong>
          <span class="badge shared">Sea at 42%</span>
        </div>
        <div class="canvas">
          <div class="land">
            <div class="sky"></div>
            <div class="sea"></div>
            <img class="logo moon" src="../assets/app-icon.png" alt="mossx" />
            <div class="caption">
              <div class="copy">
                <strong>正在恢复 Shared 会话…</strong>
                <em>投影 · 42%</em>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <p class="note">和 03 的圆轨完全不是一个空间。风险：诗意过重，工程感不足；长会话加载超过 3s 可能显得矫情。</p>
  </div>
</body>
</html>
