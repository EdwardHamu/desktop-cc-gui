<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>12 · Statusline · Session Loading</title>
  <link rel="stylesheet" href="../tokens.css" />
  <script src="../embed.js"></script>
  <style>
    .canvas {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-end;
      padding: 0;
    }
    .void { flex: 1; min-height: 0; }
    .dock { width: 100%; flex: 0 0 40px; }
    .dock {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 40px;
      padding: 0 14px;
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-item);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-faint);
    }
    .dock img { width: 16px; height: 16px; border-radius: 4px; }
    .dock b { color: var(--text-stronger); font-weight: 550; }
    .caret {
      width: 6px;
      height: 12px;
      background: var(--text-accent);
      animation: blink 1s steps(1) infinite;
    }
    .shared .caret { background: var(--status-success); }
    .fill {
      margin-left: auto;
      width: 88px;
      height: 2px;
      background: color-mix(in srgb, var(--text-fainter) 22%, transparent);
    }
    .fill i {
      display: block;
      height: 100%;
      background: var(--status-success);
    }
    .scan {
      margin-left: auto;
      width: 88px;
      height: 2px;
      overflow: hidden;
      background: color-mix(in srgb, var(--text-fainter) 22%, transparent);
    }
    .scan i {
      display: block;
      width: 28%;
      height: 100%;
      background: var(--text-accent);
      animation: sweep 1.15s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>
</head>
<body class="force-motion">
  <div class="page">
    <a class="back" href="index.html">← Round 2</a>
    <header class="page-head">
      <p class="page-kicker">12 · Bottom dock</p>
      <h1>Statusline</h1>
      <p>画布空着，加载住在底栏，像编辑器 statusline。logo 缩成 16px 印章。Native 闪标；Shared 报相位和 42%。</p>
    </header>
    <div class="pair">
      <section class="pane">
        <div class="pane-meta">
          <strong>Native · DSH</strong>
          <span class="badge native">Dock only</span>
        </div>
        <div class="canvas">
          <div class="void"></div>
          <div class="dock">
            <img src="../assets/app-icon.png" alt="mossx" />
            <b>LOCAL</b>
            <span>reading transcript</span>
            <i class="caret" aria-hidden="true"></i>
            <span class="scan"><i></i></span>
          </div>
        </div>
      </section>
      <section class="pane shared">
        <div class="pane-meta">
          <strong>Shared</strong>
          <span class="badge shared">projection 42%</span>
        </div>
        <div class="canvas">
          <div class="void"></div>
          <div class="dock">
            <img src="../assets/app-icon.png" alt="mossx" />
            <b>SHARED</b>
            <span>投影</span>
            <i class="caret" aria-hidden="true"></i>
            <span>42%</span>
            <span class="fill"><i style="width:42%"></i></span>
          </div>
        </div>
      </section>
    </div>
    <p class="note">上一轮「安静」方案把信息藏到中间，空得发慌。这个空是故意的：消息区保持干净，状态下沉。风险：用户可能觉得「没在加载」。</p>
  </div>
</body>
</html>
