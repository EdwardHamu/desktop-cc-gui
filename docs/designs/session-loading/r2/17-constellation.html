<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>17 · Constellation · Session Loading</title>
  <link rel="stylesheet" href="../tokens.css" />
  <script src="../embed.js"></script>
  <style>
    .sky { display: grid; justify-items: center; gap: 20px; }
    .field {
      position: relative;
      width: 200px;
      height: 160px;
    }
    .field img {
      position: absolute;
      left: 82px;
      top: 62px;
      width: 36px;
      height: 36px;
      border-radius: 10px;
    }
    .star {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-fainter);
    }
    .star:nth-child(1) { left: 18px; top: 78px; }
    .star:nth-child(2) { left: 48px; top: 28px; }
    .star:nth-child(3) { left: 108px; top: 12px; }
    .star:nth-child(4) { left: 168px; top: 36px; }
    .star:nth-child(5) { left: 176px; top: 96px; }
    .star:nth-child(6) { left: 128px; top: 138px; }
    .star:nth-child(7) { left: 58px; top: 132px; }
    .native .star { animation: twinkle 1.6s ease-in-out infinite; }
    .native .star:nth-child(2) { animation-delay: 0.15s; }
    .native .star:nth-child(3) { animation-delay: 0.3s; }
    .native .star:nth-child(4) { animation-delay: 0.45s; }
    .native .star:nth-child(5) { animation-delay: 0.6s; }
    .native .star:nth-child(6) { animation-delay: 0.75s; }
    .native .star:nth-child(7) { animation-delay: 0.9s; }
    .shared .star.on {
      background: var(--status-success);
      box-shadow: 0 0 8px color-mix(in srgb, var(--status-success) 45%, transparent);
    }
    .lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .shared .lines line {
      stroke: color-mix(in srgb, var(--status-success) 45%, transparent);
      stroke-width: 1;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="force-motion">
  <div class="page">
    <a class="back" href="index.html">← Round 2</a>
    <header class="page-head">
      <p class="page-kicker">17 · Graph</p>
      <h1>Constellation</h1>
      <p>消息被收成星点，logo 是星团核。Native 七颗星轮流亮，不承诺数量。Shared 只点亮 3/7（约 42%）并连线。不是气泡骨架。</p>
    </header>
    <div class="pair">
      <section class="pane native">
        <div class="pane-meta">
          <strong>Native · DSH</strong>
          <span class="badge native">Twinkle</span>
        </div>
        <div class="canvas">
          <div class="sky">
            <div class="field">
              <i class="star"></i><i class="star"></i><i class="star"></i>
              <i class="star"></i><i class="star"></i><i class="star"></i>
              <i class="star"></i>
              <img src="../assets/app-icon.png" alt="mossx" />
            </div>
            <div class="copy">
              <strong>正在加载对话窗口…</strong>
              <em>正在加载本地 transcript 和会话状态。</em>
            </div>
          </div>
        </div>
      </section>
      <section class="pane shared">
        <div class="pane-meta">
          <strong>Shared</strong>
          <span class="badge shared">3 / 7 · 42%</span>
        </div>
        <div class="canvas">
          <div class="sky">
            <div class="field">
              <svg class="lines" viewBox="0 0 200 160" aria-hidden="true">
                <line x1="21" y1="81" x2="51" y2="31" />
                <line x1="51" y1="31" x2="111" y2="15" />
                <line x1="111" y1="15" x2="100" y2="80" />
              </svg>
              <i class="star on"></i><i class="star on"></i><i class="star on"></i>
              <i class="star"></i><i class="star"></i><i class="star"></i>
              <i class="star"></i>
              <img src="../assets/app-icon.png" alt="mossx" />
            </div>
            <div class="copy">
              <strong>正在恢复 Shared 会话…</strong>
              <em>投影 transcript · 42%</em>
            </div>
          </div>
        </div>
      </section>
    </div>
    <p class="note">星点数写死 7，绝不跟 sizeBytes 挂钩。上一轮 skeleton 用气泡像假消息，这个刻意抽象成点。</p>
  </div>
</body>
</html>
