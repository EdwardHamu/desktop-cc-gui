<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>06 · Moon Pulse · Session Loading</title>
  <link rel="stylesheet" href="tokens.css" />
  <script src="embed.js"></script>
  <style>
    .mark { display: grid; place-items: center; gap: 22px; }
    .logo.lg {
      animation: moon 2.6s ease-in-out infinite;
      filter: saturate(0.95);
    }
    .shared .logo.lg {
      animation-duration: 3.2s;
    }
    .whisper {
      color: var(--text-fainter);
      font-size: 13px;
      letter-spacing: 0.01em;
    }
    .pct {
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    @keyframes moon {
      0%, 100% { opacity: 0.62; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="force-motion">
  <div class="page">
    <a class="back" href="index.html">← Session Loading 选款</a>
    <header class="page-head">
      <p class="page-kicker">06 · Quietest</p>
      <h1>Moon Pulse</h1>
      <p>不要条，不要环。只让双月 logo 自己呼吸。Native 一行说明；Shared 在呼吸下面放一个很淡的 42%。等待被当成「还在这个产品里」，不是进度仪表盘。</p>
    </header>
    <div class="pair">
      <section class="pane">
        <div class="pane-meta">
          <strong>Native · DSH</strong>
          <span class="badge native">Breath only</span>
        </div>
        <div class="canvas">
          <div class="mark">
            <img class="logo lg" src="assets/app-icon.png" alt="mossx" />
            <div class="whisper">正在加载对话窗口…</div>
          </div>
        </div>
      </section>
      <section class="pane shared">
        <div class="pane-meta">
          <strong>Shared</strong>
          <span class="badge shared">Breath + %</span>
        </div>
        <div class="canvas">
          <div class="mark">
            <img class="logo lg" src="assets/app-icon.png" alt="mossx" />
            <div class="whisper">正在恢复 Shared 会话…</div>
            <div class="pct">42%</div>
          </div>
        </div>
      </section>
    </div>
    <p class="note">长加载（Shared 投影）可能显得「没在干活」。短 Native 加载是它的主场。若选这个，Shared 超时后要能升级成 04 的相位轨。</p>
  </div>
</body>
</html>
