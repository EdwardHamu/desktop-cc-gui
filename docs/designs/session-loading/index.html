<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Session Loading · 10 选 1</title>
  <style>
    :root {
      --text-primary: #e6e7ea;
      --text-stronger: #d9d9d9;
      --text-muted: #b3b3b3;
      --text-faint: #808080;
      --text-fainter: #737373;
      --text-accent: #7a9dcc;
      --surface-messages: oklch(0.141 0.005 285.823);
      --surface-card: oklch(0.21 0.006 285.885);
      --surface-item: oklch(0.195 0.006 286);
      --border-subtle: oklch(0.245 0.005 286);
      --border-strong: oklch(0.32 0.006 286);
      --status-success: #78ebbe;
      --status-warning: #ffaf55;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      --mono: "SF Mono", Menlo, Monaco, "Microsoft YaHei Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--surface-messages);
      color: var(--text-primary);
      font-family: var(--font);
    }
    body { padding: 28px 32px 96px; }
    header { max-width: 1180px; margin: 0 auto 22px; }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .brand img {
      width: 28px;
      height: 28px;
      border-radius: 8px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 620;
      letter-spacing: -0.02em;
    }
    .lede {
      margin: 0;
      max-width: 80ch;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .pill {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--surface-item);
      color: var(--text-faint);
      font-size: 11px;
    }
    .grid {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .card {
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      background: var(--surface-card);
      overflow: hidden;
    }
    .card.is-hidden { display: none; }
    .card-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px 10px;
    }
    .card-title { font-size: 14px; font-weight: 600; }
    .card-id {
      color: var(--text-fainter);
      font-family: var(--mono);
      font-size: 11px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 10px;
      color: var(--text-faint);
      font-size: 11px;
    }
    iframe {
      display: block;
      width: 100%;
      height: 520px;
      border: 0;
      border-top: 1px solid var(--border-subtle);
      background: var(--surface-messages);
    }
    .open {
      display: inline-block;
      padding: 0 16px 14px;
      color: var(--text-accent);
      font-size: 12px;
      text-decoration: none;
    }
    .open:hover { color: var(--text-primary); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .filter {
      cursor: pointer;
      font: inherit;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--surface-item);
      color: var(--text-faint);
    }
    .filter.is-on {
      color: var(--text-primary);
      border-color: color-mix(in srgb, var(--status-success) 45%, var(--border-strong));
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="assets/app-icon.png" alt="mossx" />
      <span style="color:#808080;font-size:12px;letter-spacing:0.08em;">MOSSX · SESSION LOADING</span>
    </div>
    <h1>切换会话时的画布幕布 · 第一轮</h1>
    <p class="lede">
      你留了 03 / 04 / 10。其余偏同质，第二轮已换几何重画。
      <a href="r2/index.html" style="color:#7a9dcc">打开 Round 2 →</a>
    </p>
    <div class="pills">
      <span class="pill">Native = 本地 transcript，禁假相位</span>
      <span class="pill">Shared = prepare → snapshot → projection → merge</span>
      <span class="pill">logo 必现</span>
      <span class="pill">幕布只占 messages pane</span>
    </div>
    <div class="filters">
      <button class="filter is-on" data-tag="all">全部</button>
      <button class="filter" data-tag="ship">更接近落地</button>
      <button class="filter" data-tag="brand">品牌更重</button>
      <button class="filter" data-tag="quiet">更安静</button>
      <button class="filter" data-tag="info">信息更密</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <script>
    const ITEMS = [
      { id: "01", file: "01-emblem-bar.html", title: "Emblem + Bar", tags: ["ship"], blurb: "现状最小升级：logo 换掉 spinner" },
      { id: "02", file: "02-centered-mark.html", title: "Centered Mark", tags: ["brand"], blurb: "大 emblem + Native 环 / Shared 弧" },
      { id: "03", file: "03-orbit-halo.html", title: "Orbit Halo", tags: ["brand"], blurb: "一颗点绕双月，Shared 停在 42%" },
      { id: "04", file: "04-phase-rail.html", title: "Phase Rail", tags: ["info", "ship"], blurb: "Shared 四段真相位，Native 一条本地轨" },
      { id: "05", file: "05-canvas-chrome.html", title: "Canvas Chrome", tags: ["ship"], blurb: "幕布待在画布里，侧栏 / composer 还在" },
      { id: "06", file: "06-moon-pulse.html", title: "Moon Pulse", tags: ["quiet", "brand"], blurb: "只让 logo 呼吸，不要条" },
      { id: "07", file: "07-quiet-stamp.html", title: "Quiet Stamp", tags: ["quiet"], blurb: "一行字 + caret，像读盘" },
      { id: "08", file: "08-restore-card.html", title: "Restore Card", tags: ["info"], blurb: "报正在恢复哪一条会话" },
      { id: "09", file: "09-skeleton-transcript.html", title: "Skeleton Transcript", tags: ["info"], blurb: "先画消息骨架，再露身份" },
      { id: "10", file: "10-identity-split.html", title: "Identity Split", tags: ["brand", "ship"], blurb: "mossx + engine / mossx + Shared" },
    ];
    const grid = document.getElementById("grid");
    grid.innerHTML = ITEMS.map((item) => `
      <article class="card" data-tags="${item.tags.join(" ")}">
        <div class="card-meta">
          <div class="card-title">${item.title}</div>
          <div class="card-id">${item.id}</div>
        </div>
        <div class="tags">${item.blurb}</div>
        <iframe src="${item.file}" title="${item.title}" loading="lazy"></iframe>
        <a class="open" href="${item.file}">打开单页 →</a>
      </article>
    `).join("");

    const filters = document.querySelectorAll(".filter");
    filters.forEach((btn) => {
      btn.addEventListener("click", () => {
        filters.forEach((b) => b.classList.toggle("is-on", b === btn));
        const tag = btn.dataset.tag;
        document.querySelectorAll(".card").forEach((card) => {
          card.classList.toggle(
            "is-hidden",
            tag !== "all" && !card.dataset.tags.includes(tag)
          );
        });
      });
    });
  </script>
</body>
</html>
